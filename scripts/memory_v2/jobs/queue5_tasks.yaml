      then: "the config differs from X7 (a2C_6ep) beyond the press data paths, the pair filter and init_memory (see config_diff; keys the reference run did not have are ignored)"
    - if: "m.get('guard')"
      then: "the guard stopped the run: see GUARD.json"
  on_pass: "arm A trained; the press closed loop (10 dev scenes, on / null) follows once the press scene bank and counters are in"
  on_fail: "stage 2 did not complete: inspect press_6ep/stdout.log"

