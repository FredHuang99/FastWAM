# ---- 11-06 plan v8 D2 (Opus, item 1): memory-aware one-step distillation pilot on the A100, teacher = X7.
# D2-dry (acceptance (c), ~20 min, between LAT-smoke and S1-offline) -> D2-pilot-train (~28 h, after S1-offline, needs
# D2-dry PASS) -> D2-pilot-sweep (offline 10/4/2/1 steps, ~1 h) and D2-pilot-loop (closed loop, after S1, ~22 h).
- id: D2-dry
  lane: extra
  kind: shell
  after: [LAT-smoke]
  need_mib: 34000
  timeout_h: 1
  hypothesis: "plan v8 D7 item 1 acceptance (c): with X7's saved config (pairs off), the distillation mode (teacher = X7, 10-step teacher rollout, EMA) runs 4 dry updates; its start check (student = teacher; a perturbed student does not leak into the teacher's rollout and moves its own) and first-update check (teacher unchanged, bf16 ActionDiT = fp32 masters rounded) pass; the step time vs x7_nopairs is reported (expected <= 1.2x)"
  failure_explanations:
    - if: "m['rc'] != 0"
      then: "the distillation dry run crashed or a check failed (a shell task only records rc): read profile/x7_distill/DISTILL_CHECK.json and the job log; D2-pilot-train stays SKIPPED"
  command: "cd /workspace/FastWAM-memory2 && PYTHONPATH=src /opt/mwam/bin/python scripts/memory_v2/profile_step.py --updates 4 --cases x7_nopairs_m2 x7_distill --tag D2 --python /opt/mwam/bin/python && /opt/mwam/bin/python -c \"import json,sys; c=json.load(open('{O}/profile/x7_distill/DISTILL_CHECK.json')); print(json.dumps(c, indent=1)); sys.exit(0 if c['start']['ok'] and c['after_first_update']['ok'] else 1)\""
  pass_if: "m['rc'] == 0"
  on_pass: "send report/PROFILE_D2_*.md (x7_distill vs x7_nopairs step time, peak memory, distillation checks); D2-pilot-train may start"
  on_inconclusive: "(shell ERROR) read the job log"

- id: D2-pilot-train
  lane: train
  kind: train
  # 11-07 14:30 (Opus): attempt 1 was stopped at update 174 by the FM loss guard (median of the last 16 updates
  # 0.00268 > 2.5 x median of the first 8 = 0.00246). A false trip: the distillation FM is heavy-tailed (single
  # updates 0.0007-0.0115 from the start; 22-24 % of updates > 0.004 both in updates 1-42 and 148-174) and its
  # median did not rise (updates 1-42: 0.00146; 148-174: 0.00152); endpoint / teacher terms flat, no non-finite
  # value. The run resumes from its own checkpoint update_000174.pt (train_v2 resume tolerates a changed guard
  # section only) with medians over 64 updates for both the baseline and the window (factor 2.5 kept).
  # Recipe, data, teacher and pass_if unchanged. GUARD.json of attempt 1 kept as GUARD_update174.json.
  after: [S1-offline, D2-dry]
  requires_pass: [D2-dry]
  need_mib: 34000
  run: x7_distill_e3
  reference_run: a2C_6ep
  hypothesis: "plan v8 D2 pilot (pre-registered 11-06): one-step distillation of X7 into a student started from X7 (teacher-anchored path: the student regresses the straight velocity eps - a0_T toward the teacher's 10-step endpoint a0_T, plus the tau = 1 term; same history, memory dropout 0.15, no pairs; ActionDiT lr 1e-5, memory lr 2e-5, EMA 0.995 every 4 updates; teacher held in bf16; micro batch 2 for the 40 GB A100, global batch 64 as X7; 3 epochs = 2010 updates). On the 96 in-training val windows, the EMA student's ONE-step sampled-chunk error (on_s1) <= 1.10 x the teacher's TEN-step error (update 0 = the teacher), and its memory gap at one step (null_s1 - on_s1) >= 0.8 x the teacher's ten-step gap (null - on)"
  sets:
    - optim.lr_action=1e-5
    - optim.lr_memory=2e-5
    - schedule.epochs=3
    - schedule.micro_batch=2
    - schedule.eval_every=335
    - schedule.keep_last=1
    - schedule.save_every=335
    - guard.loss_factor=2.5
    - guard.start_update=120
    - distill.teacher={O}/a2C_6ep/checkpoints/update_004020.pt
    - distill.teacher_steps=10
    - distill.ema=0.995
    - distill.ema_every=4
    - "eval.steps=[1]"
    - guard.loss_baseline_updates=64
    - guard.loss_window=64
  inconclusive_if: "not m.get('eval_first') or 'on_s1/arm_rmse_rad' not in (m.get('eval_last') or {})"
  pass_if: "m.get('complete') and m['eval_last']['on_s1/arm_rmse_rad'] <= 1.10 * m['eval_first']['on/arm_rmse_rad'] and (m['eval_last']['null_s1/arm_rmse_rad'] - m['eval_last']['on_s1/arm_rmse_rad']) >= 0.8 * (m['eval_first']['null/arm_rmse_rad'] - m['eval_first']['on/arm_rmse_rad'])"
  failure_explanations:
    - if: "m.get('distill_check') and not all(m['distill_check'].values())"
      then: "a distillation check failed (teacher swap / restore): read x7_distill_e3/DISTILL_CHECK.json; a code bug, not a result"
    - if: "m.get('guard')"
      then: "the guard stopped the run: see GUARD.json"
    - if: "m.get('config_diff') and any(v[1] is not None and not k.startswith(('name', 'output', 'init_memory', 'pairs', 'distill', 'eval.steps', 'schedule.epochs', 'schedule.keep_last', 'schedule.save_every', 'schedule.micro_batch', 'guard')) for k, v in m['config_diff'].items())"
      then: "the config differs from X7 beyond the distillation keys (see config_diff): the student is not X7's recipe"
    - if: "m.get('eval_last') and len(m.get('eval_curve', [])) >= 3 and m['eval_curve'][-1].get('on_s1') is not None and m['eval_curve'][-2].get('on_s1') and m['eval_curve'][-1]['on_s1'] < 0.95 * m['eval_curve'][-2]['on_s1']"
      then: "the one-step error was still falling > 5% between the last two evaluations: extend to 6 epochs (new run x7_distill_e6) before judging"
    - if: "m.get('eval_last') and (m['eval_last']['null_s1/arm_rmse_rad'] - m['eval_last']['on_s1/arm_rmse_rad']) < 0.8 * (m['eval_first']['null/arm_rmse_rad'] - m['eval_first']['on/arm_rmse_rad'])"
      then: "distillation weakened the memory dependence: rerun with X7's counterfactual pairs (pairs.file={O}/pairs/pairs_v1.json, weight 0.5, per_update 8, X7's max_visual_distance): the teacher's endpoint on a swapped history is then the history -> action target"
    - if: "m.get('eval_last') and m['eval_last']['on_s1/arm_rmse_rad'] > 1.10 * m['eval_first']['on/arm_rmse_rad'] and m['eval_last']['on_s1/arm_rmse_rad'] >= m['eval_first']['on_s1/arm_rmse_rad']"
      then: "the student's one step is no better than X7's own (naive) one step (eval_first on_s1): the teacher-anchored path adds nothing over the endpoint term; try distill.gt_weight=0.5, else a consistency term (needs code)"
  on_pass: "D2-pilot-loop decides the closed-loop claim (DP-D2)"
  on_fail: "see failure_explanations"

- id: D2-pilot-sweep
  lane: extra
  kind: shell
  after: [D2-pilot-train]
  requires_pass: [D2-pilot-train]
  need_mib: 30000
  timeout_h: 4
  hypothesis: "descriptive: the distilled student (EMA, final checkpoint) on ALL val windows at 10 / 4 / 2 / 1 Euler steps, memory on vs null, next to STEPS_SWEEP_a2C_6ep (the teacher)"
  failure_explanations:
    - if: "m['rc'] != 0"
      then: "the sweep did not finish (a shell task only records rc): read the job log"
  command: "cd /workspace/FastWAM-memory2 && PYTHONPATH=src /opt/mwam/bin/python scripts/memory_v2/steps_sweep.py --run x7_distill_e3 --steps 10 4 2 1 --python /opt/mwam/bin/python"
  pass_if: "m['rc'] == 0"
  on_pass: "send report/STEPS_SWEEP_x7_distill_e3_*.md with STEPS_SWEEP_a2C_6ep_*.md"
  on_inconclusive: "(shell ERROR) read the job log"

- id: D2-pilot-loop
  lane: loop        # 11-10 (Opus): back on the A100. The 5090's online path is not equivalent to the A100's (11-07: same
                    # scene / weights / noise, its first chunk = the A100's delayed by 2 targets; S2 / S4 invalid), so no
                    # closed loop that a verdict depends on runs there until it passes an online parity. Card unchanged.
  kind: closed_loop
  after: [D2-pilot-train, S1]
  requires_pass: [D2-pilot-train]
  need_mib: 30000
  hypothesis: "plan v8 D2 (pre-registered 11-06): the distilled one-step student keeps X7's closed-loop memory gain. Student (EMA), memory on, execute 8, ONE Euler step, official put_back scenes 1-50 and swap scenes 1-50; same scenes as X7 at ten steps, B0-6ep (null) and X7 at one step (S1). Pass: pooled progress (student - X7 ten steps) >= -0.05 AND (student - B0) >= 0.6 x (X7 ten steps - B0) AND (student - X7 one step) >= 0"
  checkpoint: x7_distill_e3/last
  label: x7d_steps1_exec8
  modes: ["on"]
  scenes: [closed_loop/scenes_seed42_n100_put_back_block, closed_loop/scenes_seed42_n100_swap_blocks]
  tasks: [put_back_block, swap_blocks]
  online_args: ["--execute", "8", "--steps", "1", "--limit", "50"]
  output: closed_loop/d2_pilot
  min_episodes: 80
  compare:
    ten_step:
      mode: "on"
      ref_mode: "on"
      put_back_block: {folders: [closed_loop/h200/official_pilot, closed_loop/official/put_x7_s0, closed_loop/official/put_x7_s1], label: a2C6_e6}
      swap_blocks: {folders: [closed_loop/official/swap8_x7_s0, closed_loop/official/swap8_x7_s1, closed_loop/official/swap8_x7_s2], label: a2C6_e6_exec8}
    b0:
      mode: "on"
      ref_mode: "null"
      put_back_block: {folders: [closed_loop/h200/official/put8_b0_s0, closed_loop/h200/official/put8_b0_s1], label: a2B0_e6_exec8}
      swap_blocks: {folders: [closed_loop/official/swap8_b0_s0, closed_loop/official/swap8_b0_s1, closed_loop/official/swap8_b0_s2], label: a2B0_e6_exec8}
    naive_one:
      mode: "on"
      ref_mode: "on"
      put_back_block: {folders: [closed_loop/s1_steps1], label: x7_steps1_exec8}
      swap_blocks: {folders: [closed_loop/s1_steps1], label: x7_steps1_exec8}
  inconclusive_if: "m.get('compare', {}).get('ten_step', {}).get('pooled', {}).get('n', 0) < 80 or m.get('compare', {}).get('naive_one', {}).get('pooled', {}).get('n', 0) < 80"
  pass_if: "m['compare']['ten_step']['pooled']['delta'] >= -0.05 and m['compare']['b0']['pooled']['delta'] >= 0.6 * (m['compare']['b0']['pooled']['delta'] - m['compare']['ten_step']['pooled']['delta']) and m['compare']['naive_one']['pooled']['delta'] >= 0.0"
  failure_explanations:
    - if: "m['compare']['ten_step']['pooled']['delta'] < -0.15"
      then: "the distilled one step still loses >= 0.15 progress against ten steps: the claim becomes 'few-step' (2 / 4 steps from D2-pilot-sweep), latency table at 4 steps"
    - if: "m['compare']['naive_one']['pooled']['delta'] < 0"
      then: "the student is worse than X7's own one step: check that teacher and student saw the same history rule and dropout (DISTILL_CHECK.json, config_diff); most likely a bug, not a result"
    - if: "m['compare']['ten_step']['pooled']['delta'] >= -0.05 and m['compare']['b0']['pooled']['delta'] < 0.6 * (m['compare']['b0']['pooled']['delta'] - m['compare']['ten_step']['pooled']['delta'])"
      then: "the student keeps the ten-step level but its gain over B0 shrinks below 60%: report as a negative result (memory gain does not survive distillation)"
  on_pass: "DP-D2: claim 2 (one-step decoding with memory) stands on the pilot; D2-final is queued after Phase C"
  on_fail: "see failure_explanations; DP-D2 uses v7's title"

# S1 moved here on 11-06 19:50 (card unchanged): the pool starts runnable tasks in file order, so D2-pilot-train
# takes the GPU that S1-offline frees and S1 follows on the next free GPU (D2-pilot-loop needs both).
- id: S1
  lane: ws          # 11-07: RTX 5090 workstation (pool lanes [ws]); A100 lanes skip it
  kind: closed_loop
  hold: true        # 11-07 14:10: attempt 2 already runs on the A100 (GPU 3 since 06:11, 54/100 at 14:00) and finishes there;
                    # the 5090 copy is stopped so the same episodes are not run twice (verdict on the A100)
  after: [S1-offline]
  need_mib: 30000
  hypothesis: "plan v7 Q2 / S1 (pre-registered 11-05): with memory, ONE Euler step keeps the closed-loop gain. X7 (a2C_6ep), memory on, execute 8, steps 1, official put_back scenes 1-50 and swap scenes 1-50; compared on the same scenes with X7 at 10 steps (on) and with B0-6ep (null). Pass: pooled progress (one step - ten steps) >= -0.05 AND (one step - B0) >= 0.6 x (ten steps - B0)"
  # references: X7 put = H200 official_pilot (scenes 1-30, synced) + official/put_x7_s0/s1 (31-100); B0 put = h200/official/put8_b0_s0/s1 (synced)
  checkpoint: a2C_6ep/last
  label: x7_steps1_exec8
  modes: ["on"]
  scenes: [closed_loop/scenes_seed42_n100_put_back_block, closed_loop/scenes_seed42_n100_swap_blocks]
  tasks: [put_back_block, swap_blocks]
  online_args: ["--execute", "8", "--steps", "1", "--limit", "50"]
  output: closed_loop/s1_steps1
  min_episodes: 80
  compare:
    ten_step:
      mode: "on"
      ref_mode: "on"
      put_back_block: {folders: [closed_loop/h200/official_pilot, closed_loop/official/put_x7_s0, closed_loop/official/put_x7_s1], label: a2C6_e6}
      swap_blocks: {folders: [closed_loop/official/swap8_x7_s0, closed_loop/official/swap8_x7_s1, closed_loop/official/swap8_x7_s2], label: a2C6_e6_exec8}
    b0:
      mode: "on"
      ref_mode: "null"
      put_back_block: {folders: [closed_loop/h200/official/put8_b0_s0, closed_loop/h200/official/put8_b0_s1], label: a2B0_e6_exec8}
      swap_blocks: {folders: [closed_loop/official/swap8_b0_s0, closed_loop/official/swap8_b0_s1, closed_loop/official/swap8_b0_s2], label: a2B0_e6_exec8}
  inconclusive_if: "m.get('compare', {}).get('ten_step', {}).get('pooled', {}).get('n', 0) < 80"
  pass_if: "m['compare']['ten_step']['pooled']['delta'] >= -0.05 and m['compare']['b0']['pooled']['delta'] >= 0.6 * (m['compare']['b0']['pooled']['delta'] - m['compare']['ten_step']['pooled']['delta'])"
  failure_explanations:
    - if: "m['compare']['ten_step']['pooled']['delta'] < -0.15"
      then: "one-step decoding itself loses >= 0.15 progress against ten steps: the claim becomes 'few-step' (check 2 / 4 steps in STEPS_SWEEP and on the final model, E-steps), not one-step"
    - if: "-0.15 <= m['compare']['ten_step']['pooled']['delta'] < -0.05"
      then: "one step costs 0.05-0.15 progress: report the curve (STEPS_SWEEP + this run) without a claim"
    - if: "m['compare']['ten_step']['pooled']['delta'] >= -0.05 and m['compare']['b0']['pooled']['delta'] < 0.6 * (m['compare']['b0']['pooled']['delta'] - m['compare']['ten_step']['pooled']['delta'])"
      then: "one step keeps the ten-step progress level but the gain over B0 shrinks below 60%: report as a negative result (memory gain does not survive one-step decoding)"
  on_pass: "plan v7 Q2 claim stands at X7: with memory, one-step decoding keeps the closed-loop gain; repeat on the final model (E-steps)"
  on_fail: "see failure_explanations; Q2 stays descriptive"

