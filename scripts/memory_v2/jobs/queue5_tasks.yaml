- id: X7-loop-swap-more
  lane: extra
  kind: closed_loop
  after: [X7-loop-put]
  hypothesis: "the X7 swap result holds on the seed-18/19 scenes (descriptive; pooled with the seed-17 scenes in its folder)"
  need_mib: 30000
  checkpoint: a2C_6ep/last
  label: a2C6_e6
  modes: ["on", "null"]
  scenes: [closed_loop/scenes_seed18_n8_swap_blocks, closed_loop/scenes_seed19_n8_swap_blocks]
  tasks: [swap_blocks]
  output: closed_loop/x7
  reference: {folders: [closed_loop/a2, closed_loop/a2_more], label: a2C_e3, modes: ["on", "null"]}
  min_episodes: 16
