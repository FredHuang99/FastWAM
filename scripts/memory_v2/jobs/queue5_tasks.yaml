# ------------------------------------------------------------------------------------------------ remote lane (H200 host, container mwam2, GPU0)
# Added 10-28 03:50. Started by hand when GPU0 is free (guard + lane in one script). Every task here is
# self-contained on that host (no dependency on the A100 lanes; on and null of a scene both run on the H200).
# Results are copied back to the A100 host for the ledger; nothing is pooled with A100 episodes (P8b moved to gpu0).
- id: R-smoke
  lane: remote
  kind: closed_loop
  hypothesis: "H200 host: the execute-8 closed loop runs (frozen scene, 48 targets): decisions every 8, commands == executed; rendering and CuRobo (sm90) work; A100-vs-H200 action difference recorded (descriptive)"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_smoke8_h200
  modes: ["on"]
  scenes: [frozen]
  tasks: [put_back_block]
  online_args: ["--execute", "8", "--max-targets", "48"]
  output: closed_loop/h200_smoke
  parity_with: {folders: [closed_loop/smoke_exec8], label: a2C_e3_smoke8, modes: ["on"]}
  min_episodes: 1
  pass_if: "m['decision_gaps'] == [8] and m['command_to_execution_exact'] and m['parity_decisions'] >= 3"
  on_fail: "the H200 host cannot run the closed loop as is: remote tasks are skipped; see the task log"

