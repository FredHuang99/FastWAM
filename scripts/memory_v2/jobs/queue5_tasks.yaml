# queue5 task file (week plan v3/v4, 2026-10-26 -> 10-31 00:00 Beijing = end of Friday; until 10-28 03:50 the
# deadline was 10-30 12:00). Re-read by every lane before each pick:
# tasks can be added, edited or put on hold (hold: true) while the lanes run. Thresholds (pass_if) are pre-registered:
# do not edit a task's pass_if after it started; add a new task id instead.
#
# lanes:  loop  = container GPU1 (closed loop)      train = container GPU2 (training, then its own closed loops)
#         extra = container GPU3 = host GPU4 (from 10-26 20:00: X7, 6-epoch A2C, then its closed loops)
#         gpu0  = container GPU0 = host GPU0 (from 10-28 04:00: the U1 arms, then P8b on the A100)
#         remote = H200 host, container mwam2, GPU0 (self-contained tasks; started by hand)
#         cpu   = no GPU (analyses of existing episodes)
# paths are relative to outputs/memory_v2 unless absolute; {O} = outputs/memory_v2.
#
# D1 (Tue 15:00): if X6 (perturbation-recovery data) is GO, put X6 tasks before X5-train or set X5-train hold: true.

defaults: &put_back_ref
  folders: [closed_loop/a2]
  label: a2C_e3
  modes: ["on"]
put8: &put8_ref                     # A2C e3 at execute 8 (X1-exec8 / X1-put-null / P8): the put_back reference from 10-27
  folders: [closed_loop/a2_infer/exec8]
  label: a2C_e3_exec8
  modes: ["on", "null"]
put_scenes: &put_scenes [closed_loop/scenes_seed17_n10, closed_loop/scenes_seed18_n8_put_back_block, closed_loop/scenes_seed19_n8_put_back_block, closed_loop/scenes_seed20_n8_put_back_block]

tasks:
# ------------------------------------------------------------------------------------------------ cpu lane
- id: X3
  lane: cpu
  kind: analysis
  hypothesis: "swap on-vs-null S2 gap seen on 10 scenes (5/0) holds on >= 24 scenes (G-A)"
  wait_for_exit: ["a100_extra.sh"]
  need_mib: 0
  folders: [closed_loop/a2, closed_loop/a2_more]
  label: a2C_e3
  modes: ["on", "null"]
  tasks: [swap_blocks]
  min_episodes: 20
  inconclusive_if: "m['on_vs_null']['swap_blocks']['s2'][2] < 24"
  pass_if: "sign_p(m['on_vs_null']['swap_blocks']['s2'][0], m['on_vs_null']['swap_blocks']['s2'][1]) < 0.05 and m['on_vs_null']['swap_blocks']['s2'][1] <= 1"
  failure_explanations:
    - if: "m['swap_blocks/on']['n'] and m['swap_blocks/on']['s2'] / m['swap_blocks/on']['n'] < 0.7"
      then: "on reaches S2 much less often than on the seed-17 scenes (9/10): the seed-17 bank is easy; record the block layouts"
    - if: "m['swap_blocks/null']['n'] and m['swap_blocks/null']['s2'] / m['swap_blocks/null']['n'] > 0.5"
      then: "null also reaches S2 often: the memory effect was over-estimated on 10 scenes"
  on_pass: "G-A PASS: swap memory effect significant; paper headline = on vs null stage funnel"
  on_fail: "G-A FAIL: claim becomes 'trend + offline PR'; X3b / next week adds scenes"
  on_inconclusive: "fewer than 24 paired scenes: X3-final (with the seed-20 scenes of X3b) decides"

- id: X3-final
  lane: cpu
  kind: analysis
  after: [X3b-run]
  hypothesis: "G-A on every swap scene (seed 17 + 18 + 19 + 20 banks)"
  need_mib: 0
  folders: [closed_loop/a2, closed_loop/a2_more]
  label: a2C_e3
  modes: ["on", "null"]
  tasks: [swap_blocks]
  min_episodes: 20
  inconclusive_if: "m['on_vs_null']['swap_blocks']['s2'][2] < 24"
  pass_if: "sign_p(m['on_vs_null']['swap_blocks']['s2'][0], m['on_vs_null']['swap_blocks']['s2'][1]) < 0.05 and m['on_vs_null']['swap_blocks']['s2'][1] <= 1"
  on_pass: "G-A PASS on all scenes"
  on_fail: "G-A FAIL on all scenes: report the funnel and the conditional protocol instead of success rates"

- id: GA-x1
  lane: cpu
  kind: analysis
  after: [H8-swap-a, H8-swap-b]
  requires_pass: [X1-swap]
  hypothesis: "G-A at the X1 inference setting (same rule as X3, registered before the data)"
  need_mib: 0
  folders: [closed_loop/a2_infer/swap_best]
  label: a2C_e3_x1best
  modes: ["on", "null"]
  tasks: [swap_blocks]
  reference: {folders: [closed_loop/a2, closed_loop/a2_more], label: a2C_e3, modes: ["on", "null"]}
  min_episodes: 40
  inconclusive_if: "m['on_vs_null']['swap_blocks']['s2'][2] < 24"
  pass_if: "sign_p(m['on_vs_null']['swap_blocks']['s2'][0], m['on_vs_null']['swap_blocks']['s2'][1]) < 0.05 and m['on_vs_null']['swap_blocks']['s2'][1] <= 1"
  failure_explanations:
    - if: "m['swap_blocks/on']['success'] > r['swap_blocks/on']['success']"
      then: "the X1 setting raises swap success over execute 24 on the same scenes"
    - if: "m['swap_blocks/null']['s2'] > r['swap_blocks/null']['s2'] + 3"
      then: "null reaches S2 more often with frequent replanning: part of the on-null gap at execute 24 was drift, not memory"
  on_pass: "G-A PASS at the final inference setting: headline table uses this setting"
  on_fail: "report the per-stage paired tests (S2 / S3 / pressed) with the reverse scenes; G-A strict rule not met"

# week plan v4 (10-27 14:30): progress = stages reached in order / 6, paired on - null, sign-flip permutation test
- id: PG-A
  lane: cpu
  kind: analysis
  after: [P8-run]
  hypothesis: "put_back at execute 8 (34 scenes): memory on progresses further than history masked (primary: paired progress, registered 10-27 14:30 while P8 runs, before any of its on/null pairs was looked at)"
  need_mib: 0
  folders: [closed_loop/a2_infer/exec8]
  label: a2C_e3_exec8
  modes: ["on", "null"]
  tasks: [put_back_block]
  min_episodes: 40
  inconclusive_if: "m['prog_on_vs_null']['put_back_block']['n'] < 24"
  pass_if: "m['prog_on_vs_null']['put_back_block']['p'] < 0.05 and m['prog_on_vs_null']['put_back_block']['delta'] > 0"
  failure_explanations:
    - if: "m['on_vs_null']['put_back_block']['pressed'][0] >= 4 and m['on_vs_null']['put_back_block']['pressed'][1] == 0"
      then: "the effect sits at the press (null centres the block and does not press) and is diluted by later control failures: report the press pairs"
    - if: "m['put_back_block/on']['n'] and m['put_back_block/on']['success'] / m['put_back_block/on']['n'] < 0.2"
      then: "on succeeds less on the new scenes than on seed 17 (3/10): the seed-17 put_back scenes are easy"
    - if: "(m['put_back_block/null'].get('pressed_given_centre') or 0) > 0.5"
      then: "null presses after centring in most episodes: 'null does not press' on 10 scenes was chance"
  on_pass: "PG-A PASS: put_back memory effect at execute 8; the press is a memory decision point"
  on_fail: "put_back reported with stage pairs + the execute dose curve; the memory claim rests on swap"
  on_inconclusive: "fewer than 24 paired scenes: P8b adds 16"

- id: PG-A-final
  lane: cpu
  kind: analysis
  after: [PG-A, P8b-run]
  hypothesis: "secondary, pooled (registered 10-28 03:50; PG-A on the 34 scenes stays the primary test): PG-A on every put_back scene, seeds 17-22 (P8 + P8b), all on the A100 (P8b moved from the H200 to GPU0 10-28 04:00)"
  need_mib: 0
  folders: [closed_loop/a2_infer/exec8, closed_loop/a2_infer/exec8_p8b]
  label: a2C_e3_exec8
  modes: ["on", "null"]
  tasks: [put_back_block]
  min_episodes: 60
  inconclusive_if: "m['prog_on_vs_null']['put_back_block']['n'] < 24"
  pass_if: "m['prog_on_vs_null']['put_back_block']['p'] < 0.05 and m['prog_on_vs_null']['put_back_block']['delta'] > 0"

- id: X7-H8
  lane: cpu
  kind: analysis
  after: [X7-H8-s0, X7-H8-s1, X7-H8-s2]
  hypothesis: "6-epoch A2C on swap at execute 8 is not worse than at execute 24 on the common scenes in progress AND success (registered 10-29 16:00 before any X7 execute-8 swap episode)"
  need_mib: 0
  folders: [closed_loop/x7_exec8/s0, closed_loop/x7_exec8/s1, closed_loop/x7_exec8/s2]
  label: a2C6_e6_exec8
  modes: ["on", "null"]
  tasks: [swap_blocks]
  reference: {folders: [closed_loop/x7], label: a2C6_e6, modes: ["on", "null"]}
  min_episodes: 48
  inconclusive_if: "m['prog_vs_reference']['on']['swap_blocks']['n'] < 20"
  pass_if: "m['prog_vs_reference']['on']['swap_blocks']['delta'] >= -0.05 and m['vs_reference']['on']['swap_blocks']['success'][1] - m['vs_reference']['on']['swap_blocks']['success'][0] <= 0.1 * m['vs_reference']['on']['swap_blocks']['success'][2]"
  failure_explanations:
    - if: "m['vs_reference']['on']['swap_blocks']['s3'][1] > m['vs_reference']['on']['swap_blocks']['s3'][0] + 2"
      then: "execute 8 loses the late swap stages (S3 / press) with the 6-epoch model too: chunk-boundary switching after S2 (U1b-type fix or execute 24 for swap)"
    - if: "m['prog_on_vs_null']['swap_blocks']['p'] >= 0.05"
      then: "the swap memory effect at execute 8 is not significant with the 6-epoch model"
  on_pass: "one protocol for next week: 6-epoch model, execute 8 for both tasks"
  on_fail: "next week's protocol: 6-epoch model with a task-specific execute horizon (put_back 8, swap 24), or U1b for swap"

- id: S-X3
  lane: cpu
  kind: analysis
  hypothesis: "post-hoc (after the data; for writing only): progress on - null on the 34 swap scenes at execute 24"
  need_mib: 0
  folders: [closed_loop/a2, closed_loop/a2_more]
  label: a2C_e3
  modes: ["on", "null"]
  tasks: [swap_blocks]
  min_episodes: 40

- id: S-X1-exec12
  lane: cpu
  kind: analysis
  hypothesis: "post-hoc: put_back progress at execute 12 vs 24 (same 10 scenes)"
  need_mib: 0
  folders: [closed_loop/a2_infer/exec12]
  label: a2C_e3_exec12
  modes: ["on"]
  tasks: [put_back_block]
  reference: *put_back_ref
  min_episodes: 8

- id: S-X1-steps30
  lane: cpu
  kind: analysis
  hypothesis: "post-hoc: put_back progress with 30 denoising steps vs 10 (execute 24, same 10 scenes)"
  need_mib: 0
  folders: [closed_loop/a2_infer/steps30]
  label: a2C_e3_steps30
  modes: ["on"]
  tasks: [put_back_block]
  reference: *put_back_ref
  min_episodes: 8

- id: S-X1-exec8
  lane: cpu
  kind: analysis
  after: [P8-run]
  hypothesis: "post-hoc: put_back progress at execute 8 vs 24 (the 10 seed-17 scenes both have)"
  need_mib: 0
  folders: [closed_loop/a2_infer/exec8]
  label: a2C_e3_exec8
  modes: ["on"]
  tasks: [put_back_block]
  reference: *put_back_ref
  min_episodes: 8

# ------------------------------------------------------------------------------------------------ loop lane (GPU1)
- id: X1-smoke
  lane: loop
  kind: closed_loop
  hypothesis: "--execute 8 is honoured end to end (decisions every 8 targets, commands == executed targets)"
  wait_for_exit: ["a100_final.sh", "closed_loop.sh (plan|eval) 1 "]
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_smoke8
  modes: ["on"]
  scenes: [frozen]
  tasks: [put_back_block]
  online_args: ["--execute", "8", "--max-targets", "48"]
  output: closed_loop/smoke_exec8
  min_episodes: 1
  pass_if: "m['decision_gaps'] == [8] and m['command_to_execution_exact']"
  on_fail: "execute plumbing broken: X1 variants with --execute are skipped (fix online.py / sim_adapter.py)"

- id: X1-exec8
  lane: loop
  kind: closed_loop
  after: [X1-smoke]
  requires_pass: [X1-smoke]
  hypothesis: "replanning every 8 targets (MaP-WAM: execute 8 of 32) keeps put_back on the expert manifold after the press -> regrasp"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_exec8
  modes: ["on"]
  scenes: [closed_loop/scenes_seed17_n10]
  tasks: [put_back_block]
  online_args: ["--execute", "8"]
  output: closed_loop/a2_infer/exec8
  reference: *put_back_ref
  min_episodes: 8
  pass_if: "m['put_back_block/on']['regrasp'] >= 3 or m['put_back_block/on']['success'] >= 2"
  failure_explanations: &x1_explanations
    - if: "m['put_back_block/on']['regrasp'] <= r['put_back_block/on']['regrasp']"
      then: "no more regrasps than with execute 24: the drift is not caused by the open-loop length (with all X1 variants: X6 / X4)"
    - if: "m['put_back_block/on']['stage1'] < r['put_back_block/on']['stage1'] - 2"
      then: "the variant hurts the earlier stages (lift / centre / press): reject it regardless of regrasps"
    - if: "c['put_back_block/on']['idle'] >= 3"
      then: "idling rises with replanning frequency (Chen 2025): prefer execute 12"
    - if: "c['put_back_block/on']['failed'] and c['put_back_block/on']['unseen_state'] >= 0.5 * c['put_back_block/on']['failed']"
      then: "post-press states are still off the expert distribution: data coverage (X6 perturbation-recovery / DAgger)"
    - if: "c['put_back_block/on']['phase_regression'] >= 3"
      then: "after the press the policy goes back to earlier phases: task progress not represented (progress head / memory)"
    - if: "m['errors'] >= 3"
      then: "simulator errors: infrastructure; rerun before judging"
  on_pass: "this setting becomes the default inference (X1-swap checks swap S2 >= 8/10); X6 cancelled; GPU2 does X5"
  on_fail: "if every X1 variant FAILs: drift is not from the open-loop length -> X6 if feasible, else X5; put_back = drift failure analysis"

- id: X1-exec12
  lane: loop
  kind: closed_loop
  after: [X1-exec8]
  requires_pass: [X1-smoke]
  hypothesis: "replanning every 12 targets fixes the post-press drift without the idling of execute 8"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_exec12
  modes: ["on"]
  scenes: [closed_loop/scenes_seed17_n10]
  tasks: [put_back_block]
  online_args: ["--execute", "12"]
  output: closed_loop/a2_infer/exec12
  reference: *put_back_ref
  min_episodes: 8
  pass_if: "m['put_back_block/on']['regrasp'] >= 3 or m['put_back_block/on']['success'] >= 2"
  failure_explanations: *x1_explanations
  on_pass: "this setting becomes the default inference (if it beats exec8 on regrasp)"
  on_fail: "see X1-exec8"

- id: X1-steps30
  lane: loop
  kind: closed_loop
  after: [X1-exec12]
  hypothesis: "30 denoising steps (MemoryWAM / LingBot use 50 in sim) give precise enough actions to regrasp after the press"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_steps30
  modes: ["on"]
  scenes: [closed_loop/scenes_seed17_n10]
  tasks: [put_back_block]
  online_args: ["--steps", "30"]
  output: closed_loop/a2_infer/steps30
  reference: *put_back_ref
  min_episodes: 8
  pass_if: "m['put_back_block/on']['regrasp'] >= 3 or m['put_back_block/on']['success'] >= 2"
  failure_explanations: *x1_explanations
  on_pass: "more denoising steps help: default steps 30"
  on_fail: "see X1-exec8"

- id: X1-swap
  lane: loop
  kind: closed_loop
  after: [X1-exec8, X1-exec12, X1-steps30]
  hypothesis: "the winning X1 setting keeps swap S2 (>= 8/10) and improves S3 -> success"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_x1best
  modes: ["on"]
  scenes: [closed_loop/scenes_seed17_n10]
  tasks: [swap_blocks]
  best_of:
    ids: [X1-exec8, X1-exec12, X1-steps30]
    key: "put_back_block/on.regrasp"
    args: {X1-exec8: ["--execute", "8"], X1-exec12: ["--execute", "12"], X1-steps30: ["--steps", "30"]}
  output: closed_loop/a2_infer/swap_best
  reference: {folders: [closed_loop/a2], label: a2C_e3, modes: ["on"]}
  min_episodes: 8
  pass_if: "m['swap_blocks/on']['s2'] >= 8"
  failure_explanations:
    - if: "m['swap_blocks/on']['s3'] > r['swap_blocks/on']['s3']"
      then: "S3 improved: the drift fix also helps the third move"
  on_pass: "X1 PASS overall: the winner is the default inference setting from now on"
  on_fail: "the winner hurts swap: keep execute 24 for swap, the winner only for put_back (task-specific inference = a caveat)"

- id: X1-put-null
  lane: loop
  kind: closed_loop
  after: [X1-swap]
  hypothesis: "with the winning setting, the mat the block returns to depends on the history (on vs null, same scenes)"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_x1best              # replaced by the winner's label / folder: its on episodes are reused, null is new
  modes: ["on", "null"]
  scenes: [closed_loop/scenes_seed17_n10]
  tasks: [put_back_block]
  best_of:
    ids: [X1-exec8, X1-exec12, X1-steps30]
    key: "put_back_block/on.regrasp"
    args: {X1-exec8: ["--execute", "8"], X1-exec12: ["--execute", "12"], X1-steps30: ["--steps", "30"]}
    use:
      X1-exec8: {label: a2C_e3_exec8, output: closed_loop/a2_infer/exec8}
      X1-exec12: {label: a2C_e3_exec12, output: closed_loop/a2_infer/exec12}
      X1-steps30: {label: a2C_e3_steps30, output: closed_loop/a2_infer/steps30}
  output: closed_loop/a2_infer/put_null
  min_episodes: 16
  inconclusive_if: "m['put_back_block/on']['returned'] < 6"
  pass_if: "m['put_back_block/on'].get('correct_mat', 0) >= 6 and m['put_back_block/null'].get('correct_mat', 0) <= 3"
  failure_explanations:
    - if: "m['put_back_block/null']['regrasp'] >= 3"
      then: "null also regrasps: the regrasp is a control skill; the memory decision is the returned mat (correct_mat)"
    - if: "m['put_back_block/on']['returned'] < 6"
      then: "too few returns to judge the mat choice: the memory decision needs the conditional protocol (X4)"
  on_pass: "put_back memory decision holds in full closed loop (on picks the original mat, null does not)"
  on_fail: "put_back memory decision not shown in full closed loop: X4 (expert prefix -> policy) decides it"

# G-A again at the X1 inference setting (added 10-26 20:00 after X1-exec8 PASS, X3 FAIL; before any X1-swap data):
# only if X1-swap PASSes (the setting keeps swap S2); shard 0/2 on GPU1 after X1-put-null, shard 1/2 on GPU2 after
# the nopairs eval (X5 starts after it). X1-swap FAIL -> all SKIPPED, the plan continues unchanged.
- id: H8-swap-a
  lane: loop
  kind: closed_loop
  after: [X1-put-null]
  requires_pass: [X1-swap]
  hypothesis: "headline at the X1 inference setting: a2C_e3 on vs null on every swap scene (shard 0/2; seed-17 on episodes of X1-swap reused)"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_x1best
  modes: ["on", "null"]
  scenes: [closed_loop/scenes_seed17_n10, closed_loop/scenes_seed18_n8_swap_blocks, closed_loop/scenes_seed19_n8_swap_blocks]
  tasks: [swap_blocks]
  online_args: ["--shard", "0/2"]
  best_of:
    ids: [X1-exec8, X1-exec12, X1-steps30]
    key: "put_back_block/on.regrasp"
    args: {X1-exec8: ["--execute", "8"], X1-exec12: ["--execute", "12"], X1-steps30: ["--steps", "30"]}
  output: closed_loop/a2_infer/swap_best
  min_episodes: 10

# more swap scenes for G-A after X1 (before the X2 closed loop: G-A is the headline)
- id: X3b-plan
  lane: loop
  kind: shell
  after: [X1-put-null]
  hypothesis: "8 more expert-feasible swap scenes (seed 20) for G-A"
  need_mib: 10000
  command: "test -f {O}/closed_loop/scenes_seed20_n8_swap_blocks/swap_blocks.json || bash /workspace/FastWAM-memory2/scripts/memory_v2/jobs/closed_loop.sh plan {GPU} 20 8 swap_blocks"
  timeout_h: 2

- id: X3b-run
  lane: loop
  kind: closed_loop
  after: [X3b-plan]
  hypothesis: "a2C_e3 on vs null on the seed-20 swap scenes (pooled by X3-final)"
  need_mib: 30000
  timeout_h: 7
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3
  modes: ["on", "null"]
  scenes: [closed_loop/scenes_seed20_n8_swap_blocks]
  tasks: [swap_blocks]
  output: closed_loop/a2_more
  min_episodes: 6

# put_back headline at execute 8 (added 10-27 13:45 after X1: exec8 PASS, exec12 / steps30 / swap FAIL; registered
# before any new put_back scene exists). Runs on GPU1 before the X2 closed loop.
- id: P8-plan
  lane: loop
  kind: shell
  hypothesis: "24 more expert-feasible put_back scenes (seeds 18 / 19 / 20, 8 each)"
  need_mib: 10000
  timeout_h: 2
  command: "for s in 18 19 20; do test -f {O}/closed_loop/scenes_seed${s}_n8_put_back_block/put_back_block.json || bash /workspace/FastWAM-memory2/scripts/memory_v2/jobs/closed_loop.sh plan {GPU} $s 8 put_back_block || exit 1; done"

- id: P8-run
  lane: loop
  kind: closed_loop
  after: [P8-plan]
  hypothesis: "put_back at execute 8: memory on succeeds more often than history masked (null), on >= 24 paired scenes (PG-A)"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_exec8
  modes: ["on", "null"]
  scenes: *put_scenes
  tasks: [put_back_block]
  online_args: ["--execute", "8"]
  output: closed_loop/a2_infer/exec8
  min_episodes: 40
  inconclusive_if: "m['on_vs_null']['put_back_block']['success'][2] < 24"
  pass_if: "sign_p(m['on_vs_null']['put_back_block']['success'][0], m['on_vs_null']['put_back_block']['success'][1]) < 0.05"
  failure_explanations:
    - if: "m['on_vs_null']['put_back_block']['pressed'][0] >= 3 * max(1, m['on_vs_null']['put_back_block']['pressed'][1])"
      then: "the on-null gap opens at the press (null centres the block but does not press): history or a weak null branch? X5 (B0 null) decides"
    - if: "m['put_back_block/on']['n'] and m['put_back_block/on']['success'] / m['put_back_block/on']['n'] < 0.2"
      then: "on succeeds less on the new scenes than on seed 17 (3/10): the seed-17 put_back scenes are easy"
    - if: "m['put_back_block/on'].get('decided') and m['put_back_block/on'].get('correct_mat', 0) < m['put_back_block/on']['decided']"
