# ---- week plan v5 (10-29 22:30, Fable): official protocol from Friday. F1 plans the official seed-42 banks (100 per
# task, rule of the official eval_policy.py) and checks that their first 30 / 20 scenes equal the H200 banks of X8 / X9
# (copied to this host); mismatch -> F1 FAILs and every official task is skipped.
# 10-30 00:30: F1 split. F1 (both banks in one task) ERRORed at 00:14 in the swap planner after the put_back bank; its
# test -f shortcut also skipped re-planning a partial bank. F1-put / F1-swap check the planner's complete flag (a partial
# bank resumes from its next seed), F1-swap retries the planner 3 times; F3 needs F1-put only, F4 needs F1-swap.
- id: F1-put
  lane: loop
  kind: shell
  hypothesis: "official seed-42 put_back bank (100); first 30 identical to X8's bank (H200)"
  need_mib: 10000
  timeout_h: 2
  command: "C={O}/closed_loop; P=/opt/mwam/bin/python; S=/workspace/FastWAM-memory2/scripts/memory_v2/official_scenes.py; t=put_back_block; $P $S complete $C/scenes_seed42_n100_$t $t 100 || bash /workspace/FastWAM-memory2/scripts/memory_v2/jobs/closed_loop.sh plan {GPU} 42 100 $t || exit 1; $P $S complete $C/scenes_seed42_n100_$t $t 100 || exit 1; $P $S check-prefix $C/scenes_seed42_n100_$t $C/scenes_seed42_n30_$t $t || exit 1; $P $S subset $C/scenes_seed42_n100_$t $C/scenes_seed42_n100_put_back_block_from31 $t --start 30"
  pass_if: "m['rc'] == 0"

# 10-30 00:35: F1-swap -> F1-swap2. The swap planner stopped at seed 4300070: the EXPERT demo itself raised
# (AssertionError: target_pose cannot be None). The official eval_policy.py skips such a seed (expert_check, except
# Exception -> next seed); our planner keeps it and stops. skip-expert-error applies the official rule (only for
# exceptions raised in play_once; anything else stops F1-swap2 for a human) and the planner resumes.
- id: F1-swap2
  lane: loop
  kind: shell
  after: [F1-put]
  hypothesis: "official seed-42 swap bank (100, official rule for expert exceptions); first 20 identical to X9's bank (H200)"
  need_mib: 10000
  timeout_h: 4
  command: "C={O}/closed_loop; P=/opt/mwam/bin/python; S=/workspace/FastWAM-memory2/scripts/memory_v2/official_scenes.py; t=swap_blocks; B=$C/scenes_seed42_n100_$t; for i in $(seq 1 15); do $P $S complete $B $t 100 && break; bash /workspace/FastWAM-memory2/scripts/memory_v2/jobs/closed_loop.sh plan {GPU} 42 100 $t && continue; $P $S skip-expert-error $B $t; rc=$?; [ $rc -eq 1 ] && exit 1; done; $P $S complete $B $t 100 || exit 1; $P $S check-prefix $B $C/scenes_seed42_n20_$t $t || exit 1; $P $S subset $B $C/scenes_seed42_n100_swap_blocks_from21 $t --start 20"
  pass_if: "m['rc'] == 0"

