      put_back_block: {folders: [closed_loop/h200/official/put8_b0_s0, closed_loop/h200/official/put8_b0_s1], label: a2B0_e6_exec8}
      swap_blocks: {folders: [closed_loop/official/swap8_b0_s0, closed_loop/official/swap8_b0_s1, closed_loop/official/swap8_b0_s2], label: a2B0_e6_exec8}
  inconclusive_if: "m.get('compare', {}).get('ten_step', {}).get('pooled', {}).get('n', 0) < 80"
  pass_if: "m['compare']['ten_step']['pooled']['delta'] >= -0.05 and m['compare']['b0']['pooled']['delta'] >= 0.6 * (m['compare']['b0']['pooled']['delta'] - m['compare']['ten_step']['pooled']['delta'])"
  failure_explanations:
    - if: "m['compare']['ten_step']['pooled']['delta'] < -0.05"
      then: "two-step decoding loses more than 0.05 progress against ten steps: the few-step fallback needs 4 steps (offline 4 steps = 10 steps) or distillation"
    - if: "m['compare']['ten_step']['pooled']['delta'] >= -0.05 and m['compare']['b0']['pooled']['delta'] < 0.6 * (m['compare']['b0']['pooled']['delta'] - m['compare']['ten_step']['pooled']['delta'])"
      then: "two steps keep the ten-step progress level but the gain over B0 shrinks below 60 %: memory gain is fragile under few-step decoding (report with S1)"
  on_pass: "few-step fallback stands at X7: latency table reports 1 / 2 / 10 steps (with S1 and LAT-*); D2 then has to beat two steps, not ten"
  on_fail: "see failure_explanations"

