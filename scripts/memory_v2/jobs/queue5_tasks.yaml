  after: [T2-official-put]
  need_mib: 130000
  hypothesis: "plan v7 P0 acceptance: 3 closed-loop copies on one H200 (parallel: 3) give >= 2.5x the single-process episode throughput, and the first decision of every episode equals the single-process X7 run on the same scene (max |action difference| <= 1e-2). X7, put_back official scenes 1-12, memory on, execute 8; reference = the H200 single-process X7 episodes in official_pilot"
  checkpoint: a2C_6ep/checkpoints/update_004020.pt
  label: x7_par3_exec8
  modes: ["on"]
  scenes: [closed_loop/scenes_seed42_n30_put_back_block]
  tasks: [put_back_block]
  online_args: ["--execute", "8", "--limit", "12"]
  parallel: 3
  output: closed_loop/p0_par3
  min_episodes: 12
  parity_with: {folders: [closed_loop/official_pilot], label: a2C6_e6, modes: ["on"]}
  reference: {folders: [closed_loop/official_pilot], label: a2C6_e6, modes: ["on"]}
  inconclusive_if: "m.get('wall_span_s') is None or r.get('episode_wall_mean_s') is None"
  pass_if: "m.get('errors', 0) == 0 and m.get('parity_first_max_abs') is not None and m['parity_first_max_abs'] <= 1e-2 and m['episodes'] * r['episode_wall_mean_s'] / m['wall_span_s'] >= 2.5"
  failure_explanations:
