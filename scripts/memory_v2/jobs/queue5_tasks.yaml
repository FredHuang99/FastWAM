      then: "3 copies do not give 2.5x (CPU or GPU contention: compare episode_wall_mean_s with the reference, check nproc); evaluation days scale with the real factor; try parallel: 2"
    - if: "m.get('parity_first_max_abs') is not None and m['parity_first_max_abs'] > 1e-2"
      then: "the first decision differs from the single-process run on the same scene: nondeterminism under contention or a code change since official_pilot; do not use parallel evaluation for verdicts until explained"
    - if: "m.get('errors', 0) > 0"
      then: "episodes ended with ERROR.json under parallel load (simulator / RPC / memory): read the episode ERROR.json"
  on_pass: "parallel: 3 is the default for H200 / AWS evaluation tasks"
  on_fail: "see failure_explanations"

