  pass_if: "m['rc'] == 0"
  on_pass: "send report/PROFILE_N1_5090_*.md: fixes the history cap and micro batch of the Phase B press N1 / N1+P cards (queued after DP1 / DP2)"
  on_inconclusive: "(shell ERROR) read the job log"

