  hypothesis: "press stage 2, history rule A: the X7 recipe (lr_action 1e-5, lr_memory 2e-5, 6 epochs, pairs 0.5 x 8 / update) from the press stage-1 memory completes and lowers the FM loss; keys expected to differ from the reference: name, output, features, dense.output, pairs.file, pairs.max_visual_distance (press median), init_memory"
  need_mib: 30000
  run: press_6ep
  reference_run: a2C_6ep
  sets:
    - optim.lr_action=1e-5
    - optim.lr_memory=2e-5
    - init_memory={LAST:v2_press_cf}
    - schedule.epochs=6
    - schedule.micro_batch=4
    - schedule.eval_every=335
    - schedule.keep_last=2
    - schedule.save_every=200
    - guard.loss_factor=2.5
    - guard.start_update=120
    - pairs.file={O}/pairs/pairs_press_v1.json
    - pairs.weight=0.5
    - pairs.per_update=8
    - pairs.max_visual_distance={MEDIAN_VIS:{O}/pairs/pairs_press_v1.json}
  pass_if: "m.get('complete') and m.get('fm_ratio') is not None and m['fm_ratio'] < 1.0"
  failure_explanations:
