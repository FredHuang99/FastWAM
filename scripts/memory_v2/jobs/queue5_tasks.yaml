  hypothesis: "plan v8 fallback 'few-step' (pre-registered 11-07, before any S1 / S2 episode): with memory, TWO Euler steps keep the closed-loop gain. Offline (S1-offline, all val windows): 2 steps raise X7's arm error by 2 % over 10 steps (1 step: 21 %) and keep 90 % of the memory gap. X7 (a2C_6ep), memory on, execute 8, steps 2, official put_back scenes 1-50 and swap scenes 1-50 (same as S1), on the 5090; compared on the same scenes with X7 at 10 steps (on) and with B0-6ep (null). Pass: pooled progress (two steps - ten steps) >= -0.05 AND (two steps - B0) >= 0.6 x (ten steps - B0)"
  checkpoint: a2C_6ep/last
