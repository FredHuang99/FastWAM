  command: "cd /workspace/FastWAM-memory2 && PYTHONPATH=src /opt/mwam/bin/python scripts/memory_v2/press/build_dense.py build --task press_button"
  pass_if: "m['rc'] == 0"

- id: PB-features
  lane: train
