# press closed loops (A100 only, see PB-cache-a100). Counts are judged at the first confirm press
# (closed_loop_stages.analyse_press); count_correct = both counts right = the memory outcome of week plan v6 2.5.
- id: PB-smoke
  lane: loop
  kind: closed_loop
  after: [PB-plan]
  requires_pass: [PB-plan]
  hypothesis: "plumbing only, not a result: the X7 two-task model drives 1 press_button scene for 200 targets (memory on, execute 8); the simulator accepts the 1500-target cap (the adapter refuses a cap that differs from the env's step_lim), the adapter logs the press counters and both cards, and the stage analysis reads them"
  need_mib: 30000
  checkpoint: a2C_6ep/last
  label: x7_press_smoke
  modes: ["on"]
  scenes: [closed_loop/scenes_seed17_n10_press_button]
  tasks: [press_button]
  online_args: ["--execute", "8", "--max-targets", "200", "--limit", "1"]
  output: closed_loop/press_smoke
  min_episodes: 1
  pass_if: "m['press_button/on']['n'] >= 1 and m['press_button/on']['counters_logged'] == m['press_button/on']['n']"
  failure_explanations:
    - if: "m.get('episodes', 0) == 0"
      then: "no episode finished: read the task log and closed_loop/press_smoke/*/on/press_button/seed_*/simulator.log (cap mismatch, scene setup, policy load)"
    - if: "m.get('episodes', 0) > 0 and m['press_button/on']['counters_logged'] < m['press_button/on']['n']"
      then: "the episode ran but the press counters / cards are not in executed_actions.jsonl: the adapter's task_state did not find the env attributes"
  on_pass: "the press closed loop works end to end; PB-loop-A / PB-loop-B may run once their models are trained"
  on_fail: "fix the plumbing before the dev loops (they require PB-smoke)"

- id: PB-loop-A
  lane: loop
  kind: closed_loop
  after: [PB-s2-A, PB-smoke]
  requires_pass: [PB-s2-A, PB-smoke]
  hypothesis: "press pilot, history rule A (week plan v6 2.5, 10 dev scenes, execute 8, cap 1500): memory on counts correctly (both counts right at the first confirm press) in >= 3/10 episodes and in >= 2 more than history masked (null). Expected NOT to pass: rule A shows 31% of past presses and recovers the count at 3% of decisions (PB-events3)"
  need_mib: 30000
  checkpoint: press_6ep/last
  label: press_e6_exec8
  modes: ["on", "null"]
  scenes: [closed_loop/scenes_seed17_n10_press_button]
  tasks: [press_button]
  online_args: ["--execute", "8"]
  output: closed_loop/press_pilot
  min_episodes: 16
  inconclusive_if: "m.get('press_button/on', {}).get('n', 0) < 8 or m.get('press_button/null', {}).get('n', 0) < 8"
  pass_if: "m['press_button/on']['count_correct'] >= 3 and m['press_button/on']['count_correct'] >= m['press_button/null']['count_correct'] + 2"
  failure_explanations:
    - if: "m['press_button/on']['presses_total'] == 0"
      then: "v6 2.5 tier 1: no press at all with memory on: a perception / action problem (reading the cards or reaching the buttons), not memory; press_button is not the next task, try cover_blocks"
    - if: "m['press_button/on']['presses_total'] > 0 and abs(m['press_button/on']['count_correct'] - m['press_button/null']['count_correct']) <= 1"
      then: "v6 2.5 tier 2: memory has no effect; coverage of rule A is 31% of past presses (count recoverable at 3% of decisions) < 60%: the history selection misses the presses (compare PB-loop-B; next: press-anchored selection, X14)"
    - if: "m['press_button/on']['over_count'] > m['press_button/on']['n'] / 2"
      then: "most episodes press too often with memory on: the policy does not know how many presses it has done (counting failure, not reaching)"
  on_pass: "memory effect on the counting task with the training selection rule: December, the official 100 scenes"
  on_fail: "see failure_explanations; PB-loop-B says whether denser history selection fixes it"

- id: PB-loop-B
  lane: loop
  kind: closed_loop
  after: [PB-s2-B, PB-smoke, PB-loop-A]
  requires_pass: [PB-s2-B, PB-smoke]
  hypothesis: "press pilot, history rule B (landmarks every 8th frame; 91% of past presses visible, count recoverable at 81% of decisions): memory on counts correctly in >= 3/10 episodes and in >= 2 more than null (v6 2.5 tier 3). Compared with PB-loop-A on the same scenes (reference)"
  need_mib: 30000
  checkpoint: press_6ep_lm8/last
  label: press_lm8_e6_exec8
  modes: ["on", "null"]
  scenes: [closed_loop/scenes_seed17_n10_press_button]
  tasks: [press_button]
  online_args: ["--execute", "8"]
  output: closed_loop/press_pilot
  reference: {folders: [closed_loop/press_pilot], label: press_e6_exec8, modes: ["on", "null"]}
  min_episodes: 16
  inconclusive_if: "m.get('press_button/on', {}).get('n', 0) < 8 or m.get('press_button/null', {}).get('n', 0) < 8"
  pass_if: "m['press_button/on']['count_correct'] >= 3 and m['press_button/on']['count_correct'] >= m['press_button/null']['count_correct'] + 2"
  failure_explanations:
    - if: "m['press_button/on']['presses_total'] == 0"
      then: "v6 2.5 tier 1: no press at all with memory on: a perception / action problem, not memory"
    - if: "m['press_button/on']['presses_total'] > 0 and abs(m['press_button/on']['count_correct'] - m['press_button/null']['count_correct']) <= 1"
      then: "v6 2.5 tier 2 with coverage 81% (count recoverable): the selection sees the presses, so reading / training is the problem; boundary autopsy as in v6 2.4"
    - if: "r.get('press_button/on') and m['press_button/on']['count_correct'] >= r['press_button/on']['count_correct'] + 2"
      then: "denser selection helps: rule B counts correctly in >= 2 more episodes than rule A (memory on, same scenes); the selection density is a bottleneck on counting tasks"
    - if: "r.get('press_button/on') and abs(m['press_button/on']['count_correct'] - r['press_button/on']['count_correct']) <= 1"
      then: "rule B and rule A count about equally often (memory on): selection density is not what limits counting here"
  on_pass: "memory effect on the counting task once the history sees the presses: December, official 100 scenes with the denser / event-anchored selection"
  on_fail: "see failure_explanations"

# press arm C, mixed strides (user's go-ahead 11-04 20:46): every training sample / pair draws its landmark stride
# from [8, 12, 16, 24, 32] (memory_v2.history.landmark_strides, training only); evaluation windows use landmark_stride 24 (as arm A);
# at inference the stride is set freely: C is evaluated at 24 (vs arm A) and at 8 (vs arm B). Micro batches as arm B
# (stride-8 samples hold up to 48 history frames; PB-B-dry measured that fit), global batch 64. Placed after the
# A / B tasks so that the pool gives a freed GPU to them first.
- id: PB-s1-C
  lane: train
  kind: train
  config: configs/memory_v2/train_v2_press.yaml
  after: [PB-pairs]
  requires_pass: [PB-pairs, PB-B-dry]
  hypothesis: "press stage 1, mixed strides: the v2_A_cf recipe with a landmark stride drawn per sample from [8, 12, 16, 24, 32] completes and lowers the FM loss; keys expected to differ from v2_A_cf: name, output, features, dense.output, pairs.file, pairs.max_visual_distance, memory_v2.history.landmark_strides, schedule.micro_batch"
  need_mib: 30000
  run: v2_press_cf_mix
  reference_run: v2_A_cf
  sets:
    - "memory_v2.history.landmark_strides=[8, 12, 16, 24, 32]"
    - schedule.micro_batch=4
    - pairs.file={O}/pairs/pairs_press_v1.json
    - pairs.weight=0.5
    - pairs.per_update=16
    - pairs.max_visual_distance={MEDIAN_VIS:{O}/pairs/pairs_press_v1.json}
  pass_if: "m.get('complete') and m.get('fm_ratio') is not None and m['fm_ratio'] < 1.0"
  failure_explanations:
    - if: "m.get('config_diff') and any(v[1] is not None and not k.startswith(('name', 'output', 'features', 'dense.output', 'pairs.file', 'pairs.max_visual_distance', 'memory_v2.history.landmark_strides', 'schedule.micro_batch')) for k, v in m['config_diff'].items())"
      then: "the config differs from v2_A_cf beyond the press data, the pair filter, the stride set and the micro batch (see config_diff; keys the reference run did not have are ignored)"
    - if: "m.get('guard')"
      then: "the guard stopped the run: see GUARD.json"
  on_pass: "PB-s2-C continues from this memory"
  on_fail: "stage 1 did not complete: inspect v2_press_cf_mix/stdout.log; arm C waits"

- id: PB-s2-C
  lane: train
  kind: train
  config: configs/memory_v2/train_v2_press.yaml
  after: [PB-s1-C]
  requires_pass: [PB-s1-C]
  hypothesis: "press stage 2, mixed strides: the X7 recipe with a landmark stride drawn per sample from [8, 12, 16, 24, 32], micro batch 2 (as arm B), completes and lowers the FM loss; keys expected to differ from a2C_6ep: as PB-s1-C plus init_memory"
  need_mib: 30000
  run: press_6ep_mix
  reference_run: a2C_6ep
  sets:
    - "memory_v2.history.landmark_strides=[8, 12, 16, 24, 32]"
    - optim.lr_action=1e-5
    - optim.lr_memory=2e-5
    - init_memory={LAST:v2_press_cf_mix}
    - schedule.epochs=6
    - schedule.micro_batch=2
    - schedule.eval_every=335
    - schedule.keep_last=2
    - schedule.save_every=200
    - guard.loss_factor=2.5
    - guard.start_update=120
    - pairs.file={O}/pairs/pairs_press_v1.json
    - pairs.weight=0.5
    - pairs.per_update=8
    - pairs.max_visual_distance={MEDIAN_VIS:{O}/pairs/pairs_press_v1.json}
  pass_if: "m.get('complete') and m.get('fm_ratio') is not None and m['fm_ratio'] < 1.0"
  failure_explanations:
    - if: "m.get('config_diff') and any(v[1] is not None and not k.startswith(('name', 'output', 'features', 'dense.output', 'pairs.file', 'pairs.max_visual_distance', 'memory_v2.history.landmark_strides', 'schedule.micro_batch', 'init_memory')) for k, v in m['config_diff'].items())"
      then: "the config differs from X7 (a2C_6ep) beyond the press data, the pair filter, the stride set, the micro batch and init_memory (see config_diff)"
    - if: "m.get('guard')"
      then: "the guard stopped the run: see GUARD.json"
  on_pass: "arm C trained; PB-loop-C24 / PB-loop-C8 evaluate it at stride 24 and 8"
  on_fail: "stage 2 did not complete: inspect press_6ep_mix/stdout.log"

- id: PB-loop-C24
  lane: loop
  kind: closed_loop
  after: [PB-s2-C, PB-loop-A]
  requires_pass: [PB-s2-C, PB-smoke]
  hypothesis: "one mixed-stride model run at stride 24 counts about as well as the stride-24 specialist (arm A) on the same 10 dev scenes: memory-on count_correct >= arm A's - 1 (free choice of the stride at inference costs at most 1/10 here); null is run once here (masking the history makes the stride irrelevant)"
  need_mib: 30000
  checkpoint: press_6ep_mix/last
  label: press_mix_e6_exec8_at24
  modes: ["on", "null"]
  scenes: [closed_loop/scenes_seed17_n10_press_button]
  tasks: [press_button]
  online_args: ["--execute", "8", "--set", "memory_v2.history.landmark_stride=24"]
  output: closed_loop/press_pilot
  reference: {folders: [closed_loop/press_pilot], label: press_e6_exec8, modes: ["on", "null"]}
  min_episodes: 16
  inconclusive_if: "m.get('press_button/on', {}).get('n', 0) < 8 or not r.get('press_button/on')"
  pass_if: "m['press_button/on']['count_correct'] >= r['press_button/on']['count_correct'] - 1"
  failure_explanations:
    - if: "m['press_button/on']['count_correct'] <= r['press_button/on']['count_correct'] - 2"
      then: "mixing strides costs counting accuracy at stride 24: the free-T model is worse than the stride-24 specialist by >= 2/10"
    - if: "m['press_button/on']['count_correct'] >= r['press_button/on']['count_correct'] + 2"
      then: "mixed-stride training helps even at stride 24 (stride augmentation), not only flexibility"
    - if: "m['press_button/on']['presses_total'] > 0 and abs(m['press_button/on']['count_correct'] - m['press_button/null']['count_correct']) <= 1"
      then: "at stride 24 the mixed model shows no memory effect (on ~ null), like the expectation for arm A (coverage 31%)"
  on_pass: "stride 24 at inference is as good as training at 24 only"
  on_fail: "see failure_explanations"

- id: PB-loop-C8
  lane: loop
  kind: closed_loop
  after: [PB-s2-C, PB-loop-B, PB-loop-C24]
  requires_pass: [PB-s2-C, PB-smoke]
  hypothesis: "the same mixed-stride model run at stride 8 counts about as well as the stride-8 specialist (arm B) on the same scenes: memory-on count_correct >= arm B's - 1. Together with PB-loop-C24: one model, the stride chosen at inference (the free-T question of 11-04)"
  need_mib: 30000
  checkpoint: press_6ep_mix/last
  label: press_mix_e6_exec8_at8
  modes: ["on"]
  scenes: [closed_loop/scenes_seed17_n10_press_button]
  tasks: [press_button]
  online_args: ["--execute", "8", "--set", "memory_v2.history.landmark_stride=8"]
  output: closed_loop/press_pilot
  reference: {folders: [closed_loop/press_pilot], label: press_lm8_e6_exec8, modes: ["on"]}
  min_episodes: 8
  inconclusive_if: "m.get('press_button/on', {}).get('n', 0) < 8 or not r.get('press_button/on')"
  pass_if: "m['press_button/on']['count_correct'] >= r['press_button/on']['count_correct'] - 1"
  failure_explanations:
    - if: "m['press_button/on']['count_correct'] <= r['press_button/on']['count_correct'] - 2"
      then: "mixing strides costs counting accuracy at stride 8: the free-T model is worse than the stride-8 specialist by >= 2/10"
    - if: "m['press_button/on']['count_correct'] >= r['press_button/on']['count_correct'] + 2"
      then: "mixed-stride training helps at stride 8 too (stride augmentation)"
  on_pass: "stride 8 at inference is as good as training at 8 only: one model serves both budgets"
  on_fail: "see failure_explanations"

# plan v7 evidence (11-05): read-only summary of what the existing runs already logged; input for the Fable design pass
- id: V7-evidence
  lane: cpu
  kind: shell
  need_mib: 0
  timeout_h: 1
  hypothesis: "report only: (1) the history sensitivity of the velocity per tau from every run's probes (memory acts at tau >= 0.8 more than at tau <= 0.6 in the runs trained with the high-noise objective; the v2_A_bfull runs -- plain flow matching: tau uniform, no endpoint term, no memory dropout -- are the control, read through their shuffle_time / swap rows because their null branch was never trained), (2) offline FM per tau on vs null, (3) the tau-gate per injected layer, (4) the policy share of closed-loop episode time"
  failure_explanations:
    - if: "m['rc'] != 0"
      then: "no probes and no episodes were found (a shell task only records rc; read the job log)"
  command: "cd /workspace/FastWAM-memory2 && PYTHONPATH=src /opt/mwam/bin/python scripts/memory_v2/v7_evidence.py"
  pass_if: "m['rc'] == 0"
  on_pass: "send report/V7_EVIDENCE_*.md with the Fable prompt"
  on_inconclusive: "(shell ERROR) read the job log"

- id: PB-cache
  lane: train
  kind: shell
  after: [PB-parity]
  requires_pass: [PB-fetch, PB-parity]
  need_mib: 30000
  timeout_h: 10
  hypothesis: "press_button dense cache (50 demos, 45 train / 5 val, seed-17 split) in outputs/memory_v2/press/dense_press_button_v1, same format as the two-task cache"
  command: "cd /workspace/FastWAM-memory2 && PYTHONPATH=src /opt/mwam/bin/python scripts/memory_v2/press/build_dense.py build --task press_button"
  pass_if: "m['rc'] == 0"

- id: PB-features
  lane: train
  kind: shell
  after: [PB-cache]
  requires_pass: [PB-cache]
  need_mib: 30000
  timeout_h: 5
  hypothesis: "frozen Video-DiT history features for the press_button cache (outputs/memory_v2/features_press_v1, ~20 GB); v6 2.5 gate: ready before Thu 11-05 18:00"
  command: "cd /workspace/FastWAM-memory2 && PYTHONPATH=src /opt/mwam/bin/python -m fastwam.memory_v2.train_v2 features --config configs/memory_v2/train_v2_press.yaml"
  pass_if: "m['rc'] == 0"
