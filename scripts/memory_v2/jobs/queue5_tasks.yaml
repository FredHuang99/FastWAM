- id: U1a-swap
  lane: extra
  kind: closed_loop
  after: [X7-loop-put, U1-smoke]
  requires_pass: [U1-smoke]
  hypothesis: "U1a (one noise per episode) wins back swap at execute 8 (S2 >= 8, S3 >= 3)"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_u1a
