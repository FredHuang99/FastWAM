# queue5 task file (week plan v3, 2026-10-26 -> 10-30 12:00 Beijing). Re-read by every lane before each pick:
# tasks can be added, edited or put on hold (hold: true) while the lanes run. Thresholds (pass_if) are pre-registered:
# do not edit a task's pass_if after it started; add a new task id instead.
#
# lanes:  loop  = container GPU1 (closed loop)      train = container GPU2 (training, then its own closed loops)
#         extra = container GPU3 = host GPU4 (from 10-26 20:00: X7, 6-epoch A2C, then its closed loops)
#         cpu   = no GPU (analyses of existing episodes)
# paths are relative to outputs/memory_v2 unless absolute; {O} = outputs/memory_v2.
#
# D1 (Tue 15:00): if X6 (perturbation-recovery data) is GO, put X6 tasks before X5-train or set X5-train hold: true.

defaults: &put_back_ref
  folders: [closed_loop/a2]
  label: a2C_e3
  modes: ["on"]
put8: &put8_ref                     # A2C e3 at execute 8 (X1-exec8 / X1-put-null / P8): the put_back reference from 10-27
  folders: [closed_loop/a2_infer/exec8]
  label: a2C_e3_exec8
  modes: ["on", "null"]
put_scenes: &put_scenes [closed_loop/scenes_seed17_n10, closed_loop/scenes_seed18_n8_put_back_block, closed_loop/scenes_seed19_n8_put_back_block, closed_loop/scenes_seed20_n8_put_back_block]

tasks:
# ------------------------------------------------------------------------------------------------ cpu lane
- id: X3
  lane: cpu
  kind: analysis
  hypothesis: "swap on-vs-null S2 gap seen on 10 scenes (5/0) holds on >= 24 scenes (G-A)"
  wait_for_exit: ["a100_extra.sh"]
  need_mib: 0
  folders: [closed_loop/a2, closed_loop/a2_more]
  label: a2C_e3
  modes: ["on", "null"]
  tasks: [swap_blocks]
  min_episodes: 20
  inconclusive_if: "m['on_vs_null']['swap_blocks']['s2'][2] < 24"
  pass_if: "sign_p(m['on_vs_null']['swap_blocks']['s2'][0], m['on_vs_null']['swap_blocks']['s2'][1]) < 0.05 and m['on_vs_null']['swap_blocks']['s2'][1] <= 1"
  failure_explanations:
    - if: "m['swap_blocks/on']['n'] and m['swap_blocks/on']['s2'] / m['swap_blocks/on']['n'] < 0.7"
      then: "on reaches S2 much less often than on the seed-17 scenes (9/10): the seed-17 bank is easy; record the block layouts"
    - if: "m['swap_blocks/null']['n'] and m['swap_blocks/null']['s2'] / m['swap_blocks/null']['n'] > 0.5"
      then: "null also reaches S2 often: the memory effect was over-estimated on 10 scenes"
  on_pass: "G-A PASS: swap memory effect significant; paper headline = on vs null stage funnel"
  on_fail: "G-A FAIL: claim becomes 'trend + offline PR'; X3b / next week adds scenes"
  on_inconclusive: "fewer than 24 paired scenes: X3-final (with the seed-20 scenes of X3b) decides"

- id: X3-final
  lane: cpu
  kind: analysis
  after: [X3b-run]
  hypothesis: "G-A on every swap scene (seed 17 + 18 + 19 + 20 banks)"
  need_mib: 0
  folders: [closed_loop/a2, closed_loop/a2_more]
  label: a2C_e3
  modes: ["on", "null"]
  tasks: [swap_blocks]
  min_episodes: 20
  inconclusive_if: "m['on_vs_null']['swap_blocks']['s2'][2] < 24"
  pass_if: "sign_p(m['on_vs_null']['swap_blocks']['s2'][0], m['on_vs_null']['swap_blocks']['s2'][1]) < 0.05 and m['on_vs_null']['swap_blocks']['s2'][1] <= 1"
  on_pass: "G-A PASS on all scenes"
  on_fail: "G-A FAIL on all scenes: report the funnel and the conditional protocol instead of success rates"

- id: GA-x1
  lane: cpu
  kind: analysis
  after: [H8-swap-a, H8-swap-b]
  requires_pass: [X1-swap]
  hypothesis: "G-A at the X1 inference setting (same rule as X3, registered before the data)"
  need_mib: 0
  folders: [closed_loop/a2_infer/swap_best]
  label: a2C_e3_x1best
  modes: ["on", "null"]
  tasks: [swap_blocks]
  reference: {folders: [closed_loop/a2, closed_loop/a2_more], label: a2C_e3, modes: ["on", "null"]}
  min_episodes: 40
  inconclusive_if: "m['on_vs_null']['swap_blocks']['s2'][2] < 24"
  pass_if: "sign_p(m['on_vs_null']['swap_blocks']['s2'][0], m['on_vs_null']['swap_blocks']['s2'][1]) < 0.05 and m['on_vs_null']['swap_blocks']['s2'][1] <= 1"
  failure_explanations:
    - if: "m['swap_blocks/on']['success'] > r['swap_blocks/on']['success']"
      then: "the X1 setting raises swap success over execute 24 on the same scenes"
    - if: "m['swap_blocks/null']['s2'] > r['swap_blocks/null']['s2'] + 3"
      then: "null reaches S2 more often with frequent replanning: part of the on-null gap at execute 24 was drift, not memory"
  on_pass: "G-A PASS at the final inference setting: headline table uses this setting"
  on_fail: "report the per-stage paired tests (S2 / S3 / pressed) with the reverse scenes; G-A strict rule not met"

# week plan v4 (10-27 14:30): progress = stages reached in order / 6, paired on - null, sign-flip permutation test
- id: PG-A
  lane: cpu
  kind: analysis
  after: [P8-run]
  hypothesis: "put_back at execute 8 (34 scenes): memory on progresses further than history masked (primary: paired progress, registered 10-27 14:30 while P8 runs, before any of its on/null pairs was looked at)"
  need_mib: 0
  folders: [closed_loop/a2_infer/exec8]
  label: a2C_e3_exec8
  modes: ["on", "null"]
  tasks: [put_back_block]
  min_episodes: 40
  inconclusive_if: "m['prog_on_vs_null']['put_back_block']['n'] < 24"
  pass_if: "m['prog_on_vs_null']['put_back_block']['p'] < 0.05 and m['prog_on_vs_null']['put_back_block']['delta'] > 0"
  failure_explanations:
    - if: "m['on_vs_null']['put_back_block']['pressed'][0] >= 4 and m['on_vs_null']['put_back_block']['pressed'][1] == 0"
      then: "the effect sits at the press (null centres the block and does not press) and is diluted by later control failures: report the press pairs"
    - if: "m['put_back_block/on']['n'] and m['put_back_block/on']['success'] / m['put_back_block/on']['n'] < 0.2"
      then: "on succeeds less on the new scenes than on seed 17 (3/10): the seed-17 put_back scenes are easy"
    - if: "(m['put_back_block/null'].get('pressed_given_centre') or 0) > 0.5"
      then: "null presses after centring in most episodes: 'null does not press' on 10 scenes was chance"
  on_pass: "PG-A PASS: put_back memory effect at execute 8; the press is a memory decision point"
  on_fail: "put_back reported with stage pairs + the execute dose curve; the memory claim rests on swap"
  on_inconclusive: "fewer than 24 paired scenes: P8b adds 16"

- id: S-X3
  lane: cpu
  kind: analysis
  hypothesis: "post-hoc (after the data; for writing only): progress on - null on the 34 swap scenes at execute 24"
  need_mib: 0
  folders: [closed_loop/a2, closed_loop/a2_more]
  label: a2C_e3
  modes: ["on", "null"]
  tasks: [swap_blocks]
  min_episodes: 40

- id: S-X1-exec12
  lane: cpu
  kind: analysis
  hypothesis: "post-hoc: put_back progress at execute 12 vs 24 (same 10 scenes)"
  need_mib: 0
  folders: [closed_loop/a2_infer/exec12]
  label: a2C_e3_exec12
  modes: ["on"]
  tasks: [put_back_block]
  reference: *put_back_ref
  min_episodes: 8

- id: S-X1-steps30
  lane: cpu
  kind: analysis
  hypothesis: "post-hoc: put_back progress with 30 denoising steps vs 10 (execute 24, same 10 scenes)"
  need_mib: 0
  folders: [closed_loop/a2_infer/steps30]
  label: a2C_e3_steps30
  modes: ["on"]
  tasks: [put_back_block]
  reference: *put_back_ref
  min_episodes: 8

- id: S-X1-exec8
  lane: cpu
  kind: analysis
  after: [P8-run]
  hypothesis: "post-hoc: put_back progress at execute 8 vs 24 (the 10 seed-17 scenes both have)"
  need_mib: 0
  folders: [closed_loop/a2_infer/exec8]
  label: a2C_e3_exec8
  modes: ["on"]
  tasks: [put_back_block]
  reference: *put_back_ref
  min_episodes: 8

# ------------------------------------------------------------------------------------------------ loop lane (GPU1)
- id: X1-smoke
  lane: loop
  kind: closed_loop
  hypothesis: "--execute 8 is honoured end to end (decisions every 8 targets, commands == executed targets)"
  wait_for_exit: ["a100_final.sh", "closed_loop.sh (plan|eval) 1 "]
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_smoke8
  modes: ["on"]
  scenes: [frozen]
  tasks: [put_back_block]
  online_args: ["--execute", "8", "--max-targets", "48"]
  output: closed_loop/smoke_exec8
  min_episodes: 1
  pass_if: "m['decision_gaps'] == [8] and m['command_to_execution_exact']"
  on_fail: "execute plumbing broken: X1 variants with --execute are skipped (fix online.py / sim_adapter.py)"

- id: X1-exec8
  lane: loop
  kind: closed_loop
  after: [X1-smoke]
  requires_pass: [X1-smoke]
  hypothesis: "replanning every 8 targets (MaP-WAM: execute 8 of 32) keeps put_back on the expert manifold after the press -> regrasp"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_exec8
  modes: ["on"]
  scenes: [closed_loop/scenes_seed17_n10]
  tasks: [put_back_block]
  online_args: ["--execute", "8"]
  output: closed_loop/a2_infer/exec8
  reference: *put_back_ref
  min_episodes: 8
  pass_if: "m['put_back_block/on']['regrasp'] >= 3 or m['put_back_block/on']['success'] >= 2"
  failure_explanations: &x1_explanations
    - if: "m['put_back_block/on']['regrasp'] <= r['put_back_block/on']['regrasp']"
      then: "no more regrasps than with execute 24: the drift is not caused by the open-loop length (with all X1 variants: X6 / X4)"
    - if: "m['put_back_block/on']['stage1'] < r['put_back_block/on']['stage1'] - 2"
      then: "the variant hurts the earlier stages (lift / centre / press): reject it regardless of regrasps"
    - if: "c['put_back_block/on']['idle'] >= 3"
      then: "idling rises with replanning frequency (Chen 2025): prefer execute 12"
    - if: "c['put_back_block/on']['failed'] and c['put_back_block/on']['unseen_state'] >= 0.5 * c['put_back_block/on']['failed']"
      then: "post-press states are still off the expert distribution: data coverage (X6 perturbation-recovery / DAgger)"
    - if: "c['put_back_block/on']['phase_regression'] >= 3"
      then: "after the press the policy goes back to earlier phases: task progress not represented (progress head / memory)"
    - if: "m['errors'] >= 3"
      then: "simulator errors: infrastructure; rerun before judging"
  on_pass: "this setting becomes the default inference (X1-swap checks swap S2 >= 8/10); X6 cancelled; GPU2 does X5"
  on_fail: "if every X1 variant FAILs: drift is not from the open-loop length -> X6 if feasible, else X5; put_back = drift failure analysis"

- id: X1-exec12
  lane: loop
  kind: closed_loop
  after: [X1-exec8]
  requires_pass: [X1-smoke]
  hypothesis: "replanning every 12 targets fixes the post-press drift without the idling of execute 8"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_exec12
  modes: ["on"]
  scenes: [closed_loop/scenes_seed17_n10]
  tasks: [put_back_block]
  online_args: ["--execute", "12"]
  output: closed_loop/a2_infer/exec12
  reference: *put_back_ref
  min_episodes: 8
  pass_if: "m['put_back_block/on']['regrasp'] >= 3 or m['put_back_block/on']['success'] >= 2"
  failure_explanations: *x1_explanations
  on_pass: "this setting becomes the default inference (if it beats exec8 on regrasp)"
  on_fail: "see X1-exec8"

- id: X1-steps30
  lane: loop
  kind: closed_loop
  after: [X1-exec12]
  hypothesis: "30 denoising steps (MemoryWAM / LingBot use 50 in sim) give precise enough actions to regrasp after the press"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_steps30
  modes: ["on"]
  scenes: [closed_loop/scenes_seed17_n10]
  tasks: [put_back_block]
  online_args: ["--steps", "30"]
  output: closed_loop/a2_infer/steps30
  reference: *put_back_ref
  min_episodes: 8
  pass_if: "m['put_back_block/on']['regrasp'] >= 3 or m['put_back_block/on']['success'] >= 2"
  failure_explanations: *x1_explanations
  on_pass: "more denoising steps help: default steps 30"
  on_fail: "see X1-exec8"

- id: X1-swap
  lane: loop
  kind: closed_loop
  after: [X1-exec8, X1-exec12, X1-steps30]
  hypothesis: "the winning X1 setting keeps swap S2 (>= 8/10) and improves S3 -> success"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_x1best
  modes: ["on"]
  scenes: [closed_loop/scenes_seed17_n10]
  tasks: [swap_blocks]
  best_of:
    ids: [X1-exec8, X1-exec12, X1-steps30]
    key: "put_back_block/on.regrasp"
    args: {X1-exec8: ["--execute", "8"], X1-exec12: ["--execute", "12"], X1-steps30: ["--steps", "30"]}
  output: closed_loop/a2_infer/swap_best
  reference: {folders: [closed_loop/a2], label: a2C_e3, modes: ["on"]}
  min_episodes: 8
  pass_if: "m['swap_blocks/on']['s2'] >= 8"
  failure_explanations:
    - if: "m['swap_blocks/on']['s3'] > r['swap_blocks/on']['s3']"
      then: "S3 improved: the drift fix also helps the third move"
  on_pass: "X1 PASS overall: the winner is the default inference setting from now on"
  on_fail: "the winner hurts swap: keep execute 24 for swap, the winner only for put_back (task-specific inference = a caveat)"

- id: X1-put-null
  lane: loop
  kind: closed_loop
  after: [X1-swap]
  hypothesis: "with the winning setting, the mat the block returns to depends on the history (on vs null, same scenes)"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_x1best              # replaced by the winner's label / folder: its on episodes are reused, null is new
  modes: ["on", "null"]
  scenes: [closed_loop/scenes_seed17_n10]
  tasks: [put_back_block]
  best_of:
    ids: [X1-exec8, X1-exec12, X1-steps30]
    key: "put_back_block/on.regrasp"
    args: {X1-exec8: ["--execute", "8"], X1-exec12: ["--execute", "12"], X1-steps30: ["--steps", "30"]}
    use:
      X1-exec8: {label: a2C_e3_exec8, output: closed_loop/a2_infer/exec8}
      X1-exec12: {label: a2C_e3_exec12, output: closed_loop/a2_infer/exec12}
      X1-steps30: {label: a2C_e3_steps30, output: closed_loop/a2_infer/steps30}
  output: closed_loop/a2_infer/put_null
  min_episodes: 16
  inconclusive_if: "m['put_back_block/on']['returned'] < 6"
  pass_if: "m['put_back_block/on'].get('correct_mat', 0) >= 6 and m['put_back_block/null'].get('correct_mat', 0) <= 3"
  failure_explanations:
    - if: "m['put_back_block/null']['regrasp'] >= 3"
      then: "null also regrasps: the regrasp is a control skill; the memory decision is the returned mat (correct_mat)"
    - if: "m['put_back_block/on']['returned'] < 6"
      then: "too few returns to judge the mat choice: the memory decision needs the conditional protocol (X4)"
  on_pass: "put_back memory decision holds in full closed loop (on picks the original mat, null does not)"
  on_fail: "put_back memory decision not shown in full closed loop: X4 (expert prefix -> policy) decides it"

# G-A again at the X1 inference setting (added 10-26 20:00 after X1-exec8 PASS, X3 FAIL; before any X1-swap data):
# only if X1-swap PASSes (the setting keeps swap S2); shard 0/2 on GPU1 after X1-put-null, shard 1/2 on GPU2 after
# the nopairs eval (X5 starts after it). X1-swap FAIL -> all SKIPPED, the plan continues unchanged.
- id: H8-swap-a
  lane: loop
  kind: closed_loop
  after: [X1-put-null]
  requires_pass: [X1-swap]
  hypothesis: "headline at the X1 inference setting: a2C_e3 on vs null on every swap scene (shard 0/2; seed-17 on episodes of X1-swap reused)"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_x1best
  modes: ["on", "null"]
  scenes: [closed_loop/scenes_seed17_n10, closed_loop/scenes_seed18_n8_swap_blocks, closed_loop/scenes_seed19_n8_swap_blocks]
  tasks: [swap_blocks]
  online_args: ["--shard", "0/2"]
  best_of:
    ids: [X1-exec8, X1-exec12, X1-steps30]
    key: "put_back_block/on.regrasp"
    args: {X1-exec8: ["--execute", "8"], X1-exec12: ["--execute", "12"], X1-steps30: ["--steps", "30"]}
  output: closed_loop/a2_infer/swap_best
  min_episodes: 10

# more swap scenes for G-A after X1 (before the X2 closed loop: G-A is the headline)
- id: X3b-plan
  lane: loop
  kind: shell
  after: [X1-put-null]
  hypothesis: "8 more expert-feasible swap scenes (seed 20) for G-A"
  need_mib: 10000
  command: "test -f {O}/closed_loop/scenes_seed20_n8_swap_blocks/swap_blocks.json || bash /workspace/FastWAM-memory2/scripts/memory_v2/jobs/closed_loop.sh plan {GPU} 20 8 swap_blocks"
  timeout_h: 2

- id: X3b-run
  lane: loop
  kind: closed_loop
  after: [X3b-plan]
  hypothesis: "a2C_e3 on vs null on the seed-20 swap scenes (pooled by X3-final)"
  need_mib: 30000
  timeout_h: 7
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3
  modes: ["on", "null"]
  scenes: [closed_loop/scenes_seed20_n8_swap_blocks]
  tasks: [swap_blocks]
  output: closed_loop/a2_more
  min_episodes: 6

# put_back headline at execute 8 (added 10-27 13:45 after X1: exec8 PASS, exec12 / steps30 / swap FAIL; registered
# before any new put_back scene exists). Runs on GPU1 before the X2 closed loop.
- id: P8-plan
  lane: loop
  kind: shell
  hypothesis: "24 more expert-feasible put_back scenes (seeds 18 / 19 / 20, 8 each)"
  need_mib: 10000
  timeout_h: 2
  command: "for s in 18 19 20; do test -f {O}/closed_loop/scenes_seed${s}_n8_put_back_block/put_back_block.json || bash /workspace/FastWAM-memory2/scripts/memory_v2/jobs/closed_loop.sh plan {GPU} $s 8 put_back_block || exit 1; done"

- id: P8-run
  lane: loop
  kind: closed_loop
  after: [P8-plan]
  hypothesis: "put_back at execute 8: memory on succeeds more often than history masked (null), on >= 24 paired scenes (PG-A)"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_exec8
  modes: ["on", "null"]
  scenes: *put_scenes
  tasks: [put_back_block]
  online_args: ["--execute", "8"]
  output: closed_loop/a2_infer/exec8
  min_episodes: 40
  inconclusive_if: "m['on_vs_null']['put_back_block']['success'][2] < 24"
  pass_if: "sign_p(m['on_vs_null']['put_back_block']['success'][0], m['on_vs_null']['put_back_block']['success'][1]) < 0.05"
  failure_explanations:
    - if: "m['on_vs_null']['put_back_block']['pressed'][0] >= 3 * max(1, m['on_vs_null']['put_back_block']['pressed'][1])"
      then: "the on-null gap opens at the press (null centres the block but does not press): history or a weak null branch? X5 (B0 null) decides"
    - if: "m['put_back_block/on']['n'] and m['put_back_block/on']['success'] / m['put_back_block/on']['n'] < 0.2"
      then: "on succeeds less on the new scenes than on seed 17 (3/10): the seed-17 put_back scenes are easy"
    - if: "m['put_back_block/on'].get('decided') and m['put_back_block/on'].get('correct_mat', 0) < m['put_back_block/on']['decided']"
      then: "some returns go to the wrong mat: the memory decision itself fails sometimes (see the episodes)"
  on_pass: "PG-A PASS: put_back memory effect significant at execute 8; headline = put_back (exec 8) + swap (exec 24) funnels"
  on_fail: "put_back on-null gap not significant on 34 scenes: report as trend; the funnel locates where null fails"

- id: X2-loop-swap
  lane: loop
  kind: closed_loop
  after: [X2-eval]
  hypothesis: "the counterfactual pairs are a source of the closed-loop memory effect on swap (G-B)"
  need_mib: 30000
  checkpoint: a2C_nopairs/last
  label: a2C_nopairs_e3
  modes: ["on", "null"]
  scenes: [closed_loop/scenes_seed17_n10, closed_loop/scenes_seed18_n8_swap_blocks, closed_loop/scenes_seed19_n8_swap_blocks]
  tasks: [swap_blocks]
  output: closed_loop/x2
  reference: {folders: [closed_loop/a2, closed_loop/a2_more], label: a2C_e3, modes: ["on", "null"]}
  min_episodes: 30
  pass_if: "(m['swap_blocks/on']['s2'] - m['swap_blocks/null']['s2']) <= 0.5 * (r['swap_blocks/on']['s2'] - r['swap_blocks/null']['s2']) or m['swap_blocks/on']['s2'] <= r['swap_blocks/on']['s2'] - 3"
  failure_explanations:
    - if: "abs(m['swap_blocks/on']['s2'] - r['swap_blocks/on']['s2']) <= 1"
      then: "nopairs ~ A2C: the closed-loop effect comes from memory + joint fine-tuning; pairs only matter offline (rewrite contribution, add X2b from B-full next week)"
    - if: "r['swap_blocks/on']['s2'] - r['swap_blocks/null']['s2'] <= 2"
      then: "the A2C reference gap itself is small on these scenes: G-B is not decidable here"
  on_pass: "G-B PASS: pairs are a source of the closed-loop memory effect; next week a pair-ratio sweep"
  on_fail: "G-B FAIL: contribution = memory-first joint fine-tuning + leakage diagnostics + conditional protocol; pairs = offline evidence"

- id: X2-loop-put
  lane: loop
  kind: closed_loop
  after: [X2-loop-swap, X1-swap]
  hypothesis: "nopairs on put_back at execute 8 on every put_back scene vs A2C at execute 8 (descriptive)"
  need_mib: 30000
  checkpoint: a2C_nopairs/last
  label: a2C_nopairs_e3
  modes: ["on"]
  scenes: *put_scenes
  tasks: [put_back_block]
  best_of:
    ids: [X1-exec8, X1-exec12, X1-steps30]
    key: "put_back_block/on.regrasp"
    args: {X1-exec8: ["--execute", "8"], X1-exec12: ["--execute", "12"], X1-steps30: ["--steps", "30"]}
    fallback: []
  output: closed_loop/x2_put
  reference: *put8_ref
  min_episodes: 8


# filler for GPU1 (picked only when nothing above in the loop lane is runnable): 16 more put_back scenes for PG-A
- id: P8b-plan
  lane: loop
  kind: shell
  after: [X2-loop-put]
  hypothesis: "16 more expert-feasible put_back scenes (seeds 21 / 22)"
  need_mib: 10000
  timeout_h: 2
  command: "for s in 21 22; do test -f {O}/closed_loop/scenes_seed${s}_n8_put_back_block/put_back_block.json || bash /workspace/FastWAM-memory2/scripts/memory_v2/jobs/closed_loop.sh plan {GPU} $s 8 put_back_block || exit 1; done"

- id: P8b-run
  lane: loop
  kind: closed_loop
  after: [P8b-plan]
  hypothesis: "PG-A on every put_back scene (seeds 17-22, execute 8)"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_exec8
  modes: ["on", "null"]
  scenes: [closed_loop/scenes_seed17_n10, closed_loop/scenes_seed18_n8_put_back_block, closed_loop/scenes_seed19_n8_put_back_block, closed_loop/scenes_seed20_n8_put_back_block, closed_loop/scenes_seed21_n8_put_back_block, closed_loop/scenes_seed22_n8_put_back_block]
  tasks: [put_back_block]
  online_args: ["--execute", "8"]
  output: closed_loop/a2_infer/exec8
  min_episodes: 60
  inconclusive_if: "m['on_vs_null']['put_back_block']['success'][2] < 24"
  pass_if: "sign_p(m['on_vs_null']['put_back_block']['success'][0], m['on_vs_null']['put_back_block']['success'][1]) < 0.05"


# week plan v4: does swap lose at execute 8? (non-inferiority on 34 scenes), then the official-seed pilot
- id: H8-on
  lane: loop
  kind: closed_loop
  after: [P8b-run]
  hypothesis: "swap at execute 8 is not worse than at execute 24 on 34 scenes (S2 >= S2(24) - 2 and progress >= progress(24) - 0.05)"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_x1best
  modes: ["on"]
  scenes: [closed_loop/scenes_seed17_n10, closed_loop/scenes_seed18_n8_swap_blocks, closed_loop/scenes_seed19_n8_swap_blocks, closed_loop/scenes_seed20_n8_swap_blocks]
  tasks: [swap_blocks]
  online_args: ["--execute", "8"]
  output: closed_loop/a2_infer/swap_best
  reference: {folders: [closed_loop/a2, closed_loop/a2_more], label: a2C_e3, modes: ["on"]}
  min_episodes: 30
  pass_if: "m['swap_blocks/on']['s2'] >= r['swap_blocks/on']['s2'] - 2 and m['swap_blocks/on']['progress_mean'] >= r['swap_blocks/on']['progress_mean'] - 0.05"
  failure_explanations:
    - if: "m['swap_blocks/on']['decided'] and m['swap_blocks/on']['correct'] < m['swap_blocks/on']['decided']"
      then: "execute 8 moves the same block again after S1 in some episodes: mode switching at chunk boundaries (U1b's target)"
    - if: "m['swap_blocks/on']['lifted'] < r['swap_blocks/on']['lifted'] - 2"
      then: "execute 8 grasps worse: a control problem U1 cannot fix (next week: data / training)"
  on_pass: "one execute horizon (8) for both tasks; H8-null gives the swap headline at execute 8"
  on_fail: "task-specific execute horizon (put_back 8, swap 24) in the main table; unification by U1 / next week"

- id: H8-null
  lane: loop
  kind: closed_loop
  after: [H8-on]
  requires_pass: [H8-on]
  hypothesis: "swap at execute 8: memory on progresses further than history masked (34 scenes)"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_x1best
  modes: ["on", "null"]
  scenes: [closed_loop/scenes_seed17_n10, closed_loop/scenes_seed18_n8_swap_blocks, closed_loop/scenes_seed19_n8_swap_blocks, closed_loop/scenes_seed20_n8_swap_blocks]
  tasks: [swap_blocks]
  online_args: ["--execute", "8"]
  output: closed_loop/a2_infer/swap_best
  min_episodes: 60
  inconclusive_if: "m['prog_on_vs_null']['swap_blocks']['n'] < 24"
  pass_if: "m['prog_on_vs_null']['swap_blocks']['p'] < 0.05 and m['prog_on_vs_null']['swap_blocks']['delta'] > 0"

- id: X8-plan
  lane: loop
  kind: shell
  after: [H8-null]
  hypothesis: "30 expert-feasible put_back scenes from the official seed 42"
  need_mib: 10000
  timeout_h: 3
  command: "test -f {O}/closed_loop/scenes_seed42_n30_put_back_block/put_back_block.json || bash /workspace/FastWAM-memory2/scripts/memory_v2/jobs/closed_loop.sh plan {GPU} 42 30 put_back_block"

- id: X8-put
  lane: loop
  kind: closed_loop
  after: [X8-plan]
  hypothesis: "official-seed pilot (descriptive, not for the paper): put_back at execute 8, on + null, cost and variance per episode; caveat: our plan keeps expert-feasible seeds only"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_exec8
  modes: ["on", "null"]
  scenes: [closed_loop/scenes_seed42_n30_put_back_block]
  tasks: [put_back_block]
  online_args: ["--execute", "8"]
  output: closed_loop/official_pilot
  min_episodes: 10

# ------------------------------------------------------------------------------------------------ train lane (GPU2)
- id: X2-train
  lane: train
  kind: train
  hypothesis: "A2C recipe without the counterfactual pairs (second-stage ablation; memory still starts from D, which saw pairs)"
  wait_for_exit: ["a100_final.sh", "closed_loop.sh (plan|eval) 2 "]
  need_mib: 30000
  run: a2C_nopairs
  reference_run: a2C
  sets:
    - optim.lr_action=1e-5
    - optim.lr_memory=2e-5
    - init_memory={O}/v2_A_cf/checkpoints/update_001340.pt
    - schedule.epochs=3
    - schedule.micro_batch=4
    - schedule.eval_every=335
    - schedule.keep_last=2
    - schedule.save_every=200
    - guard.loss_factor=2.5
    - guard.start_update=120
  pass_if: "m.get('complete') and m.get('fm_ratio') is not None and m['fm_ratio'] < 1.0"
  failure_explanations:
    - if: "m.get('config_diff') and any(not k.startswith(('pairs.', 'name', 'output')) for k in m['config_diff'])"
      then: "the config differs from A2C beyond the pairs: the ablation is not clean (see config_diff)"
    - if: "m['guard']"
      then: "the guard stopped the run: see GUARD.json (loss rise -> lr)"
  on_fail: "training did not complete / loss rose: inspect stdout.log; the X2 closed loop waits"

- id: X2-eval
  lane: train
  kind: eval
  after: [X2-train]
  hypothesis: "without pairs the offline PR (val) is lower than A2C's by > 5 points"
  need_mib: 30000
  run: a2C_nopairs
  reference_run: a2C
  inconclusive_if: "m.get('pr_all_on') is None or r.get('pr_all_on') is None"
  pass_if: "m.get('pr_all_on') is not None and r.get('pr_all_on') is not None and m['pr_all_on'] < r['pr_all_on'] - 0.05"
  failure_explanations:
    - if: "m.get('pr_all_on') is not None and r.get('pr_all_on') is not None and abs(m['pr_all_on'] - r['pr_all_on']) < 0.03"
      then: "PR difference < 3 points: pairs do not change the offline memory use either (memory starts from D, which saw pairs: X2b)"
    - if: "m.get('full_on') and r.get('full_on') and m['full_on'] > 1.05 * r['full_on']"
      then: "offline on-error worse than A2C: pairs also regularise the action pathway"

- id: H8-swap-b
  lane: train
  kind: closed_loop
  after: [X2-eval, X1-swap]
  requires_pass: [X1-swap]
  hypothesis: "headline at the X1 inference setting: a2C_e3 on vs null on every swap scene (shard 1/2; seed-17 on episodes of X1-swap reused)"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_x1best
  modes: ["on", "null"]
  scenes: [closed_loop/scenes_seed17_n10, closed_loop/scenes_seed18_n8_swap_blocks, closed_loop/scenes_seed19_n8_swap_blocks]
  tasks: [swap_blocks]
  online_args: ["--shard", "1/2"]
  best_of:
    ids: [X1-exec8, X1-exec12, X1-steps30]
    key: "put_back_block/on.regrasp"
    args: {X1-exec8: ["--execute", "8"], X1-exec12: ["--execute", "12"], X1-steps30: ["--steps", "30"]}
  output: closed_loop/a2_infer/swap_best
  min_episodes: 10

- id: X5-train
  lane: train
  kind: train
  after: [X2-eval, X1-swap]
  hypothesis: "a model trained never seeing history (memory_dropout 1.0, no pairs) has a null branch as strong as A2C's null (attribution control)"
  need_mib: 30000
  run: a2B0
  reference_run: a2C_nopairs
  sets:
    - optim.lr_action=1e-5
    - optim.lr_memory=2e-5
    - init_memory={O}/v2_A_cf/checkpoints/update_001340.pt
    - schedule.epochs=3
    - schedule.micro_batch=4
    - schedule.eval_every=335
    - schedule.keep_last=2
    - schedule.save_every=200
    - guard.loss_factor=2.5
    - guard.start_update=120
    - guard.eval_regression=1000          # on is never trained: the on-vs-off guard does not apply
    - memory_v2.objective.memory_dropout=1.0
  pass_if: "m.get('complete') and m.get('fm_ratio') is not None and m['fm_ratio'] < 1.0"

- id: X5-loop-swap
  lane: train
  kind: closed_loop
  after: [X5-train]
  hypothesis: "A2C's on-null gap is the history content, not a weak null branch (B0-null ~ A2C-null, A2C-on - B0-null >= 4/10)"
  need_mib: 30000
  checkpoint: a2B0/last
  label: a2B0_e3
  modes: ["null"]
  scenes: [closed_loop/scenes_seed17_n10, closed_loop/scenes_seed18_n8_swap_blocks, closed_loop/scenes_seed19_n8_swap_blocks]
  tasks: [swap_blocks]
  output: closed_loop/x5
  reference: {folders: [closed_loop/a2, closed_loop/a2_more], label: a2C_e3, modes: ["on", "null"]}
  min_episodes: 16
  pass_if: "(r['swap_blocks/on']['s2'] - m['swap_blocks/null']['s2']) >= 0.4 * m['swap_blocks/null']['n'] and abs(r['swap_blocks/null']['s2'] - m['swap_blocks/null']['s2']) <= 0.2 * m['swap_blocks/null']['n']"
  failure_explanations:
    - if: "m['swap_blocks/null']['s2'] - r['swap_blocks/null']['s2'] > 0.2 * m['swap_blocks/null']['n']"
      then: "B0-null >> A2C-null: A2C's null branch was weakened (dropout 0.15 / pairs); report on - B0 instead of on - null"
  on_pass: "attribution clean: on - null = history content"
  on_fail: "report on - B0; the weak null branch goes into the limitations"

- id: X5-loop-put
  lane: train
  kind: closed_loop
  after: [X5-loop-swap, X1-swap]
  hypothesis: "put_back attribution at execute 8: A2C's on-null gap is the history content (B0-null ~ A2C-null, A2C-on - B0-null >= 0.2n successes)"
  need_mib: 30000
  checkpoint: a2B0/last
  label: a2B0_e3
  modes: ["null"]
  scenes: *put_scenes
  tasks: [put_back_block]
  best_of:
    ids: [X1-exec8, X1-exec12, X1-steps30]
    key: "put_back_block/on.regrasp"
    args: {X1-exec8: ["--execute", "8"], X1-exec12: ["--execute", "12"], X1-steps30: ["--steps", "30"]}
    fallback: []
  output: closed_loop/x5_put
  reference: *put8_ref
  min_episodes: 24
  pass_if: "(r['put_back_block/on']['success'] - m['put_back_block/null']['success']) >= 0.2 * m['put_back_block/null']['n'] and abs(r['put_back_block/null']['success'] - m['put_back_block/null']['success']) <= 0.1 * m['put_back_block/null']['n']"
  failure_explanations:
    - if: "m['put_back_block/null']['pressed'] - r['put_back_block/null']['pressed'] > 0.2 * m['put_back_block/null']['n']"
      then: "B0 presses far more often than A2C-null: A2C's null branch is weak at the press; the put_back gap is partly a weak null branch"


# week plan v4: X2b = the nopairs recipe with a stage-1 memory that never saw pairs. HOLD until the init path is
# confirmed (Ours = D without pairs; see the run listing); remove `hold: true` then.
- id: X2b-train
  lane: train
  kind: train
  hold: true
  after: [X5-loop-put]
  hypothesis: "pairs act through the stage-1 memory: the A2C recipe without pairs in either stage"
  need_mib: 30000
  run: a2C_nopairs_ours
  reference_run: a2C_nopairs
  sets:
    - optim.lr_action=1e-5
    - optim.lr_memory=2e-5
    - init_memory={O}/OURS_RUN/checkpoints/update_001340.pt
    - schedule.epochs=3
    - schedule.micro_batch=4
    - schedule.eval_every=335
    - schedule.keep_last=2
    - schedule.save_every=200
    - guard.loss_factor=2.5
    - guard.start_update=120
  pass_if: "m.get('complete') and m.get('fm_ratio') is not None and m['fm_ratio'] < 1.0"
  failure_explanations:
    - if: "m.get('config_diff') and any(not k.startswith(('init_memory', 'name', 'output')) for k in m['config_diff'])"
      then: "the config differs from a2C_nopairs beyond init_memory: not clean"

- id: X2b-eval
  lane: train
  kind: eval
  after: [X2b-train]
  hypothesis: "without pairs in either stage the offline PR drops > 5 points below nopairs (stage-2 only)"
  need_mib: 30000
  run: a2C_nopairs_ours
  reference_run: a2C_nopairs
  inconclusive_if: "m.get('pr_all_on') is None or r.get('pr_all_on') is None"
  pass_if: "m['pr_all_on'] < r['pr_all_on'] - 0.05"
  failure_explanations:
    - if: "m.get('pr_all_on') is not None and r.get('pr_all_on') is not None and abs(m['pr_all_on'] - r['pr_all_on']) < 0.03"
      then: "after joint fine-tuning pairs do not change offline memory use either: the pairs claim holds only for the frozen-base memory-only setting"

- id: X2b-loop-swap
  lane: train
  kind: closed_loop
  after: [X2b-eval]
  hypothesis: "G-B2: without pairs in both stages the swap on-null S2 gap halves vs A2C, or on S2 drops by 3 (10 scenes, execute 24)"
  need_mib: 30000
  checkpoint: a2C_nopairs_ours/last
  label: a2C_nopairs_ours_e3
  modes: ["on", "null"]
  scenes: [closed_loop/scenes_seed17_n10]
  tasks: [swap_blocks]
  output: closed_loop/x2b
  reference: {folders: [closed_loop/a2], label: a2C_e3, modes: ["on", "null"]}
  min_episodes: 16
  pass_if: "(m['swap_blocks/on']['s2'] - m['swap_blocks/null']['s2']) <= 0.5 * (r['swap_blocks/on']['s2'] - r['swap_blocks/null']['s2']) or m['swap_blocks/on']['s2'] <= r['swap_blocks/on']['s2'] - 3"
  failure_explanations:
    - if: "abs(m['swap_blocks/on']['s2'] - r['swap_blocks/on']['s2']) <= 1"
      then: "no measurable closed-loop contribution of pairs: contribution = interface + memory-first fine-tuning + diagnostics"

- id: X2b-loop-put
  lane: train
  kind: closed_loop
  after: [X2b-loop-swap]
  hypothesis: "no-pairs (both stages) on put_back at execute 8 (descriptive)"
  need_mib: 30000
  checkpoint: a2C_nopairs_ours/last
  label: a2C_nopairs_ours_e3
  modes: ["on"]
  scenes: [closed_loop/scenes_seed17_n10]
  tasks: [put_back_block]
  online_args: ["--execute", "8"]
  output: closed_loop/x2b_put
  reference: *put8_ref
  min_episodes: 8

# ------------------------------------------------------------------------------------------------ extra lane (container GPU3 = host GPU4)
- id: X7-train
  lane: extra
  kind: train
  hypothesis: "training length is a bottleneck (successful RMBench works train 10-100 epochs, RM-WAM 10): the identical A2C recipe for 6 epochs instead of 3"
  need_mib: 30000
  run: a2C_6ep
  reference_run: a2C
  sets:
    - optim.lr_action=1e-5
    - optim.lr_memory=2e-5
    - init_memory={O}/v2_A_cf/checkpoints/update_001340.pt
    - schedule.epochs=6
    - schedule.micro_batch=4
    - schedule.eval_every=335
    - schedule.keep_last=2
    - schedule.save_every=200
    - guard.loss_factor=2.5
    - guard.start_update=120
    - pairs.file={O}/pairs/pairs_v1.json
    - pairs.weight=0.5
    - pairs.per_update=8
    - pairs.max_visual_distance=0.00011537869913136323
  pass_if: "m.get('complete') and m.get('fm_ratio') is not None and m['fm_ratio'] < 1.0"
  failure_explanations:
    - if: "m.get('config_diff') and any(not k.startswith(('schedule.epochs', 'name', 'output')) for k in m['config_diff'])"
      then: "the config differs from A2C beyond the number of epochs: the comparison is not clean (see config_diff)"
    - if: "m.get('guard')"
      then: "the guard stopped the run: see GUARD.json"
  on_fail: "training did not complete: inspect a2C_6ep/stdout.log; the X7 closed loops wait"

- id: U1-smoke
  lane: extra
  kind: closed_loop
  after: [X7-train]
  hypothesis: "U1 code with 1 candidate reproduces the plain execute-8 closed loop (frozen scene, 48 targets)"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_u1smoke
  modes: ["on"]
  scenes: [frozen]
  tasks: [put_back_block]
  online_args: ["--execute", "8", "--candidates", "1", "--coherence", "overlap", "--max-targets", "48"]
  output: closed_loop/u1_smoke
  parity_with: {folders: [closed_loop/smoke_exec8], label: a2C_e3_smoke8, modes: ["on"]}
  min_episodes: 1
  pass_if: "m['parity_decisions'] >= 3 and m['parity_first_max_abs'] is not None and m['parity_first_max_abs'] <= 1e-3 and m['parity_max_abs'] <= 0.02 and m['decision_gaps'] == [8]"
  on_fail: "U1 code changes the plain path: U1 arms are skipped; fix online.py before next week"

- id: U1-smoke4
  lane: extra
  kind: closed_loop
  after: [U1-smoke]
  requires_pass: [U1-smoke]
  hypothesis: "cost of 4 candidates per decision (descriptive): policy seconds / decision vs the plain smoke"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_u1smoke4
  modes: ["on"]
  scenes: [frozen]
  tasks: [put_back_block]
  online_args: ["--execute", "8", "--candidates", "4", "--coherence", "overlap", "--max-targets", "48"]
  output: closed_loop/u1_smoke
  parity_with: {folders: [closed_loop/smoke_exec8], label: a2C_e3_smoke8, modes: ["on"]}
  min_episodes: 1

- id: X7-eval
  lane: extra
  kind: eval
  after: [X7-train]
  hypothesis: "6 epochs lower the offline error of A2C e3 (401 windows) by > 5%"
  need_mib: 30000
  run: a2C_6ep
  reference_run: a2C
  inconclusive_if: "not m.get('full_on') or not r.get('full_on')"
  pass_if: "m.get('full_on') and r.get('full_on') and m['full_on'] < 0.95 * r['full_on']"
  failure_explanations:
    - if: "m.get('full_on') and r.get('full_on') and m['full_on'] >= r['full_on']"
      then: "no offline gain from 3 more epochs: the fit saturated at 3 epochs (more data / capacity, not time)"
    - if: "m.get('pr_all_on') is not None and r.get('pr_all_on') is not None and m['pr_all_on'] < r['pr_all_on'] - 0.05"
      then: "longer training lowers the PR: the memory use weakens as the ActionDiT fits more (memory-first schedule matters)"

- id: X7-loop-swap
  lane: extra
  kind: closed_loop
  after: [X7-eval]
  hypothesis: "6-epoch A2C completes swap more often than 3-epoch A2C on the same 10 scenes (success >= 3/10 or S3 >= 6/10)"
  need_mib: 30000
  checkpoint: a2C_6ep/last
  label: a2C6_e6
  modes: ["on", "null"]
  scenes: [closed_loop/scenes_seed17_n10]
  tasks: [swap_blocks]
  output: closed_loop/x7
  reference: {folders: [closed_loop/a2], label: a2C_e3, modes: ["on", "null"]}
  min_episodes: 16
  pass_if: "m['swap_blocks/on']['success'] >= 3 or m['swap_blocks/on']['s3'] >= 6"
  failure_explanations:
    - if: "m['swap_blocks/on']['success'] <= r['swap_blocks/on']['success'] and m['swap_blocks/on']['s3'] <= r['swap_blocks/on']['s3']"
      then: "no closed-loop gain from 3 more epochs: training length is not the bottleneck (with X7-eval: offline gain without closed-loop gain = compounding error)"
    - if: "m['on_vs_null']['swap_blocks']['s2'][0] - m['on_vs_null']['swap_blocks']['s2'][1] < r['on_vs_null']['swap_blocks']['s2'][0] - r['on_vs_null']['swap_blocks']['s2'][1] - 2"
      then: "the on-null S2 gap shrinks with longer training: the policy relies less on memory as it fits the demos"
  on_pass: "train longer: 6 epochs becomes the base recipe for next week (and 10 epochs on the 8-GPU window)"
  on_fail: "3 epochs is enough for this data: next week's lever is data (X6 / DAgger), not epochs"

- id: X7-loop-put
  lane: extra
  kind: closed_loop
  after: [X7-loop-swap, X1-swap]
  hypothesis: "6-epoch A2C succeeds on put_back at execute 8 more often than 3-epoch A2C (+10 points, every put_back scene)"
  need_mib: 30000
  checkpoint: a2C_6ep/last
  label: a2C6_e6
  modes: ["on"]
  scenes: *put_scenes
  tasks: [put_back_block]
  best_of:
    ids: [X1-exec8, X1-exec12, X1-steps30]
    key: "put_back_block/on.regrasp"
    args: {X1-exec8: ["--execute", "8"], X1-exec12: ["--execute", "12"], X1-steps30: ["--steps", "30"]}
    fallback: []
  output: closed_loop/x7_put
  reference: *put8_ref
  min_episodes: 24
  pass_if: "m['put_back_block/on']['success'] >= r['put_back_block/on']['success'] + 0.1 * m['put_back_block/on']['n']"
  failure_explanations:
    - if: "m['put_back_block/on']['pressed'] > r['put_back_block/on']['pressed'] + 2"
      then: "longer training improves the pre-press stages (grasp / centre / press), the remaining put_back bottleneck"
    - if: "m['put_back_block/on']['success'] <= r['put_back_block/on']['success']"
      then: "no put_back gain from 3 more epochs: the remaining failures are not a fit problem"

# week plan v4 U1 (inference-time consistency at execute 8, no retraining; 10 + 10 seed-17 scenes). Registered 10-27 14:30.
# U1b = BID-lite backward coherence with 4 candidates; U1a = one noise vector per episode. Both must keep put_back
# (success >= 3, progress >= exec8 - 0.05) and win back swap (S2 >= 8, S3 >= 3). X7-loop-swap-more below is the filler.
- id: U1b-put
  lane: extra
  kind: closed_loop
  after: [X7-loop-put, U1-smoke]
  requires_pass: [U1-smoke]
  hypothesis: "U1b (BID-lite, 4 candidates) keeps put_back at execute 8"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_u1b
  modes: ["on"]
  scenes: [closed_loop/scenes_seed17_n10]
  tasks: [put_back_block]
  online_args: ["--execute", "8", "--candidates", "4", "--coherence", "overlap"]
  output: closed_loop/u1/b
  reference: {folders: [closed_loop/a2_infer/exec8], label: a2C_e3_exec8, modes: ["on"]}
  min_episodes: 8
  pass_if: "m['put_back_block/on']['success'] >= 3 and m['put_back_block/on']['progress_mean'] >= r['put_back_block/on']['progress_mean'] - 0.05"

- id: U1b-swap
  lane: extra
  kind: closed_loop
  after: [X7-loop-put, U1-smoke]
  requires_pass: [U1-smoke]
  hypothesis: "U1b (BID-lite, 4 candidates) wins back swap at execute 8 (S2 >= 8, S3 >= 3)"
  need_mib: 30000
  checkpoint: a2C/checkpoints/update_002010.pt
  label: a2C_e3_u1b
  modes: ["on"]
  scenes: [closed_loop/scenes_seed17_n10]
  tasks: [swap_blocks]
  online_args: ["--execute", "8", "--candidates", "4", "--coherence", "overlap"]
  output: closed_loop/u1/b
  reference: {folders: [closed_loop/a2], label: a2C_e3, modes: ["on"]}
  min_episodes: 8
  pass_if: "m['swap_blocks/on']['s2'] >= 8 and m['swap_blocks/on']['s3'] >= 3"

- id: U1a-put
  lane: extra
  kind: closed_loop
  after: [X7-loop-put, U1-smoke]
  requires_pass: [U1-smoke]
  hypothesis: "U1a (one noise per episode) keeps put_back at execute 8"
  need_mib: 30000
