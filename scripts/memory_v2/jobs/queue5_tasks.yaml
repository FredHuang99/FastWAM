  pass_if: "m['prog_on_vs_null']['swap_blocks']['p'] < 0.05 and m['prog_on_vs_null']['swap_blocks']['delta'] >= 0.5 * r['prog_on_vs_null']['swap_blocks']['delta'] and abs(m['prog_vs_reference']['on']['swap_blocks']['delta']) <= 0.10"
  failure_explanations:
    - if: "m['prog_on_vs_null']['swap_blocks']['delta'] < 0.5 * r['prog_on_vs_null']['swap_blocks']['delta']"
      then: "pairs DO contribute to the closed-loop memory effect at n=100: the 26-scene dissociation was under-powered; C2' returns to the paper as a closed-loop contribution (on - null halves without pairs)"
    - if: "m['prog_vs_reference']['on']['swap_blocks']['delta'] < -0.10 and m['prog_on_vs_null']['swap_blocks']['delta'] >= 0.5 * r['prog_on_vs_null']['swap_blocks']['delta']"
      then: "pairs raise the memory-on policy's capability (on-level) without changing the memory gap: write pairs as a training-signal / capability result, not as the source of history use"
    - if: "m['prog_vs_reference']['on']['swap_blocks']['delta'] > 0.10"
      then: "pairs HURT the on-policy at 3 epochs: check whether pair samples (8/update, weight 0.5) displace ordinary samples; re-run the pair-ratio sweep before using pairs in any recipe"
  on_pass: "paper: pairs = offline diagnostic / training-signal result; the closed-loop memory effect is attributed to memory-first joint fine-tuning + the direct-read interface (pending T2)"
  on_fail: "see failure_explanations; the training-length and attribution sections are unaffected"

