# A100 recovery only. No training or evaluation is launched by this configuration.
root: .
paths:
  base: resources/base/robotwin_uncond_3cam_384.pt
  stats: resources/base/robotwin_uncond_3cam_384_dataset_stats.json
  vae: resources/encoders/Wan2.2_VAE.pth
  t5: resources/encoders/models_t5_umt5-xxl-enc-bf16.pth
  tokenizer: resources/tokenizer/google/umt5-xxl
  raw: resources/RMBench/data/demo_clean
  prepared: resources/prepared_dense_h100_v1
  cache: resources/cache_s1_dense_a100_v1
  run: outputs/memory_s1_variable_t_h100_phase_seed17
seed: 17
global_batch: 16
steps: 2000
micro_batch: 2
learning_rate: 0.0001
min_learning_rate: 1.0e-05
warmup: 100
checkpoint_every: 100
validate_every: 500
milestone_every: 500
validation:
  schedule: deferred
log_every: 10
validation_anchors_per_task: 32
hf:
  enabled: true
  python: /opt/hf-tools/bin/python
  backup_repo: hhyfred/fastwam-memory-s1-backup
  assets_repo: hhyfred/fastwam-memory-s1-assets
  quota_gib: 93.132257462
  reserve_gib: 10
closed_loop:
  enabled: false
  simulator_python: /opt/rmbench-a100-env/bin/python
  simulator_root: resources/RMBench
  curobo_backend: fused_graph_v1
  internal_seed: 17
  official_seed: 42
  internal_episodes: 10
  official_episodes: 100
  evidence_manifest: resources/evidence_ranges.json
history:
  train_phase: uniform
  online_phase: episode_seeded
  train_min: 1
  train_max: 16
  online_period: 8
  online_cycle: []
  archive_stride: 1
  cache_shard_frames: 64
  reader_checkpointing: true
  validation_periods:
  - 1
  - 4
  - 8
  - 16
backup_budget:
  extra_stop_checkpoints: 1
  auxiliary_history_gib: 4
  weight_versions: 6
integration:
  reference_root: resources/reference/FastWAM
  public_rmbench_root: resources/reference/RMBench
  output: outputs/fastwam_rmbench_integration_a100_v1
  attention_backend: math
  subprocess_timeout: 3600
rootcause:
  episode_timeout: 3600
recovery:
  old_run_id: memory_s1_variable_t_h100_phase_seed17
  ready_directory: outputs/recovery_aws_a100_v1/restored
  output: outputs/recovery_aws_a100_v1
  expected_world_size: 8
  image: nvcr.io/nvidia/pytorch:25.11-py3
  cuda_arch: '8.0'
  max_jobs: 16
startup:
  require_ready: true
  cpu_cache_gib: 64
  local_reserve_gib: 20
  expected_world_size: 8
  parent_config: configs/memory_s1/s1_variable_t_h100.yaml
  parent_snapshot: outputs/recovery_aws_h100/phase_parent
hardware:
  name: a100_8x80
  gpus:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  compile_jobs_per_extension: 16
  parallel_extension_builds: 2
  scope: recovery_and_new_machine_checks_only_not_a_training_resume_config
