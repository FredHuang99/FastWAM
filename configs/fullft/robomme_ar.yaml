# 11-28 17:32 (Opus; plan v22 6.6, RoboMME card 10): three frames (ar) on RoboMME PickXtimes + BinFill with Fast-WAM's
# LIBERO base (single arm, two cameras at 224; action 7 / proprio 8 follow the base: FullModel.release_dims). Data =
# the RoboMME dense root (robomme_encode.py) with robomme_norm.py's normalised proprio / actions. Engineering config
# only: the R1 training recipe (epochs, exports, seeds) is registered with its reading before any R1 training.
# model.stats = "" switches the training-time metric denormaliser off (the RoboTwin stats do not apply; the
# closed loop uses the root's NORM_STATS.json).
name: robomme_ar
output: /workspace/FastWAM-memory2/outputs/fullft
seed: 17
data:
  roots: [/workspace/FastWAM-memory2/outputs/robomme/dense_robomme_v1]
  tasks: [PickXtimes, BinFill]
  events: []
  val_anchors_per_task: 96
  num_workers: 6
history:
  variant: ar
  recent: [16, 32]
optim:
  lr: 1.0e-4
  weight_decay: 1.0e-2
  betas: [0.9, 0.999]
  warmup_steps: 500
  min_lr_ratio: 0.1
  grad_clip: 1.0
schedule:
  frame_epochs: 30
  micro_batch: 8
  accumulation: 8
  log_every: 10
  eval_every: 500
  resume_every: 1000
  export_at_epochs: [10, 20, 30]
model:
  base: /workspace/FastWAM/resources/base/libero_optional_idm_2cam224.pt
  architecture: /workspace/FastWAM-memory2/configs/model/fastwam.yaml
  stats: ""
  train_video: full
  checkpoint_layers: true
